<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f1ec;color:#2f2b26;font-size:13px}
  #app{display:flex;flex-direction:column;height:100%}

  header{display:flex;align-items:center;gap:10px;padding:7px 13px;background:#fff;border-bottom:1px solid #ddd6ca;flex-wrap:wrap;flex:0 0 auto}
  header h1{font-size:14px;font-weight:600}
  header .sub{font-size:11px;color:#8b8378}
  .tools{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
  button{font-family:inherit;font-size:11px;padding:4px 9px;border:1px solid #d5cdc0;background:#fbf9f6;color:#4a443c;border-radius:5px;cursor:pointer;white-space:nowrap}
  button:hover{background:#f0eade;border-color:#c3b8a6}
  button.on{background:#e8dcc0;border-color:#bfa877;color:#5c4a24;font-weight:600}
  button.primary{background:#5c5145;color:#fff;border-color:#5c5145}
  button.primary:hover{background:#463d33}
  button.sm{font-size:10.5px;padding:3px 7px}

  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;overflow:hidden;background:#e9e4db;display:flex;min-width:0}
  svg{width:100%;height:100%;display:block}

  aside{width:336px;flex-shrink:0;background:#fff;border-left:1px solid #ddd6ca;display:flex;flex-direction:column;min-height:0;
        overflow:hidden;transition:opacity .18s ease}
  /* 侧栏把手：贴在右侧边缘，侧栏收起后仍在，点一下展开 */
  #sideToggle{position:fixed;top:50%;right:336px;transform:translateY(-50%);z-index:60;
    width:26px;height:74px;border:1px solid #ddd6ca;border-right:none;border-radius:8px 0 0 8px;
    background:#fffdf8;color:#7d6a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;box-shadow:-2px 0 6px rgba(0,0,0,.06);transition:right .22s ease,background .15s}
  #sideToggle:hover{background:#f5efe2}
  #sideToggle .arw{display:inline-block;transition:transform .22s ease}
  body.side-closed #sideToggle .arw{transform:rotate(180deg)}
  body.side-closed #sideToggle{right:0}
  .ptitle{padding:8px 12px;font-size:11px;font-weight:600;letter-spacing:.4px;color:#8b8378;border-bottom:1px solid #eee8de;background:#fcfaf7;flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .ptitle .tab{margin-left:auto;display:flex;gap:3px}
  #panelBody{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
  #warn{padding:7px 12px;background:#eef5ec;border-top:1px solid #d9e7d6;font-size:11px;color:#3f6b3f;line-height:1.5;flex:0 0 auto;max-height:130px;overflow-y:auto}
  #warn.bad{background:#fdecec;border-top-color:#f3d5d5;color:#96393c}
  #warn .wt{font-weight:700;margin-bottom:2px}
  #warn ul{list-style:none}
  #warn li{margin:1px 0;padding-left:10px;position:relative}
  #warn li:before{content:"·";position:absolute;left:1px}

  .frow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .frow label{width:62px;flex-shrink:0;font-size:11px;color:#7d7466}
  .frow input{flex:1;min-width:0;font-family:inherit;font-size:11.5px;padding:3px 5px;border:1px solid #ddd5c7;border-radius:4px;background:#fdfdfb;color:#33302b;font-variant-numeric:tabular-nums}
  .frow input:focus{outline:none;border-color:#bfa877;background:#fffdf7}
  .frow .unit{font-size:9.5px;color:#a39a8d;flex-shrink:0;width:20px}
  .frow.narrow label{width:26px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

  .badge{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap}
  .b-cad{background:#dcecdc;color:#3a6b3a}
  .b-std{background:#dde6f2;color:#39587f}
  .b-guess{background:#faeccd;color:#866017}
  .b-fix{background:#f5dcdc;color:#8a3636}
  .b-buy{background:#e8e0f5;color:#5b3f8a}

  .selname{font-size:13.5px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .selnote{font-size:10.5px;color:#8b8378;line-height:1.55;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #f0ebe2}
  .sec{font-size:10px;font-weight:600;color:#a39a8d;letter-spacing:.5px;margin:10px 0 5px;display:flex;align-items:center;gap:5px}
  .hint{font-size:10.5px;color:#a39a8d;line-height:1.7}
  .hint b{color:#6b6155}

  .list{font-size:11px}
  .li{display:flex;align-items:center;gap:5px;padding:3.5px 5px;border-radius:4px;cursor:pointer}
  .li:hover{background:#f7f3ec}
  .li.active{background:#ede5d4;font-weight:600}
  .li .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;border:1px solid rgba(0,0,0,.18)}
  .li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li .sz{font-size:9px;color:#a39a8d;font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:9.5px;color:#8b8378;padding:5px 12px;background:#fcfaf7;border-top:1px solid #eee8de;flex:0 0 auto}
  .legend span{display:flex;align-items:center;gap:3px}
  .legend i{width:8px;height:8px;border-radius:2px;border:1px solid rgba(0,0,0,.12);display:inline-block}

  table.sched{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}
  table.sched th{text-align:left;font-weight:600;color:#8b8378;padding:2px 3px;border-bottom:1px solid #eee8de;font-size:9.5px}
  table.sched td{padding:2px 3px;border-bottom:1px solid #f5f1ea;font-variant-numeric:tabular-nums}
  .tot{font-size:10.5px;color:#5c5145;background:#fcfaf7;padding:5px 7px;border-radius:4px;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Cherry Studio · 平面与灯位</h1>
    <span class="sub" id="subHdr">4748×6836</span>
    <div class="tools">
      <button id="btnGrid" class="on">网格</button>
      <button id="btnDim" class="on">尺寸</button>
      <button id="btnAisle" class="on">动线</button>
      <button id="btnLight" class="on">灯位</button>
      <button id="btnSpacing">灯距</button>
      <button id="btnBeam">光斑</button>
      <button id="btnRef">草图区块</button>
      <button id="btnReset">重置</button>
      <button id="btnCsv" class="sm">导出清单</button>
      <button id="btnJson" class="sm">存参数</button>
      <button id="btnLoad" class="sm">读参数</button>
      <button id="btnPng" class="primary">存图(高清)</button>
    </div>
  </header>
  <main>
    <div id="stage"><svg id="svg" preserveAspectRatio="xMidYMid meet"></svg></div>
    <button id="sideToggle" title="收起 / 展开侧栏（快捷键 Tab）"><span class="arw">▶</span></button>
    <aside id="side">
      <div class="ptitle">属性 / 元素<span class="tab"><button class="sm" id="tabElem">元素</button><button class="sm" id="tabLight">灯表</button><button class="sm" id="btnSideHide" title="收起侧栏">收起 ›</button></span></div>
      <div id="panelBody"></div>
      <div id="warn"></div>
      <div class="legend">
        <span><i style="background:#dcecdc"></i>图上标注</span>
        <span><i style="background:#dde6f2"></i>行业标准</span>
        <span><i style="background:#faeccd"></i>待确认</span>
        <span><i style="background:#f5dcdc"></i>固定结构</span>
        <span><i style="background:#e8e0f5"></i>已购实物</span>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";

/* ══════════════ 侧栏收起 / 展开 ══════════════ */
const SIDE_KEY = 'cherry-studio-sidecollapsed';
const SIDE_W = 336;
function setSide(closed){
  const aside=document.getElementById('side');
  const tg=document.getElementById('sideToggle');
  const arw=document.querySelector('#sideToggle .arw');
  // 直接写内联宽度：不依赖 class 优先级，收起/展开一定生效
  aside.style.width = closed ? '0px' : SIDE_W+'px';
  aside.style.minWidth = closed ? '0px' : '';
  aside.style.borderLeft = closed ? 'none' : '';
  aside.style.opacity = closed ? '0' : '1';
  aside.style.pointerEvents = closed ? 'none' : '';
  if(tg) tg.style.right = (closed ? 0 : SIDE_W)+'px';
  if(arw) arw.textContent = closed ? '◀' : '▶';
  document.body.classList.toggle('side-closed', closed);
  try{ localStorage.setItem(SIDE_KEY, closed?'1':'0'); }catch(e){}
}
function toggleSide(){
  setSide(!document.body.classList.contains('side-closed'));
}
document.getElementById('sideToggle').addEventListener('click', toggleSide);
document.getElementById('btnSideHide').addEventListener('click', toggleSide);
document.addEventListener('keydown', e=>{
  if(e.key==='Tab' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){ e.preventDefault(); toggleSide(); }
});
try{ if(localStorage.getItem(SIDE_KEY)==='1') setSide(true); }catch(e){}

/* ══════════════ 店铺参数（全部可调） ══════════════ */
const SHOP0 = {
  W: 4750,          // 开间（左墙→右墙）
  D: 6834,          // 进深（后墙→临街门面）
  H: 3000,          // 吊顶完成面高度（平顶）
  /* 左下弧角：不是 1/4 圆，是椭圆弧。
     ARCX = 沿底边从墙角量进去的跨度；ARCY = 沿左墙从墙角量上去的跨度。
     CAD 原图标注：底边 1145、左墙 2058。 */
  ARCX: 1145,
  ARCY: 2058,
  /* 门面分格：以「门右边缘到右墙的距离」为基准，比其他描述都直观。
     门右到右墙 524 → 门右 = 4750-524 = 4226；门宽 900 → 门左 3326。
     左固玻 1910 → 玻璃起 1416；右窄固玻 360 → 玻璃止 4586；剩 164 是瓷砖墙·招牌。 */
  MDR: 524,         // 门右边缘到右主墙的距离（mm）
  GX1: 1416,        // 玻璃幕墙起点 X
  GX2: 4586,        // 玻璃幕墙终点 X
  DX1: 3326,        // 玻璃门洞左
  DX2: 4226,        // 玻璃门洞右
  WY1: 3000,        // 左墙铁栅窗起点 Y
  WY2: 4300,        // 左墙铁栅窗终点 Y
  MY1: 5700,        // 右墙金属门起点 Y
  MY2: 6600,        // 右墙金属门终点 Y
  DOOR_ANG: 30      // 玻璃门外开角
};

/* ══════════════ 灯位设计参数 ══════════════ */
const LIGHT0 = {
  /* ── 三排灯网格 ──
     店铺宽 4750、深 6834，标准做法就是沿长度方向排三条纵向灯排：
       左边排 x = sideOff               (650)
       中排   x = (左边排+右边排)/2      (2375)  ← 严格居中，左右排距相等
       右边排 x = W - sideOff           (4100)
     排距 pitch = W/2 - sideOff，左右对称，三排横向严格对齐。
     沿长度方向按 spacing(900) 均分成列，三排共用同一套 Y 坐标。
     ⇒ 对齐 = 三排列坐标完全一致；趋势 = 灯距均匀、无零散补灯。 */
  /* ══ 排数：默认 4 排 ══
     用户实测观感「中间排和两边排隔了 1725 太远」，这是对的：
     1725 排距下 36° 边排光斑半径 552 + 60° 内排半径 981 虽然名义上够，
     但边排是斜着往墙上打（倾 15°），地面有效光斑要打折，
     y=3400 处横切一刀，两排之间谷值只有峰值的 39%，暗带宽 667mm。
     改成 4 排（1150 排距）后谷值升到峰值的 67%，暗带收到 108mm。
     代价：营业区 16 → 20 只，LPD 10.0 → 12.6 W/m²（GB50034 商店限值约 11）。
     所以外排保持 900 密排洗衣服，内排放到 1200 只铺通道，把增灯控制在 4 只。 */
  rowCount: 4,      // 排数：4（推荐）/ 3
  spacingInner: 1050, // 四排时内排列距（排距 1050 后，内排也按 1050 取，光带才连）
  /* 外排灯心离墙 800：这是服装店铺灯的主流做法。
     离墙太近（650）时，36° 灯斜打墙面，光还没铺开就打到墙上，墙面一圈过亮、
     墙脚一圈发暗，衣服挂上去下半截是灰的；离墙 800 时光锥有 550 半径的余量，
     打到墙面时已经展开，挂衣带上下受光均匀。
     改成 800 后，四排等距 → 排距 = (4750 − 2×800)/3 = 1050。 */
  sideOff: 800,     // 最外排灯心离墙距离（左右同值 ⇒ 四排严格等距 1050）
  spacing: 900,     // 外排沿长度方向的灯距（36° 光斑 1105，咬住 900，光带不断）
  rowStart: 700,    // 第一列距后墙（后墙一带也有光，不留黑角）
  rowEnd: 734,      // 最后一列距临街门面（6834-734-700=5400 = 6×900）
  aimH: 1300,       // 打光目标高度（衣服中部）
  tiltMax: 75,      // 象鼻灯最大俯仰（0–75° 可调）
  /* ── 光束角与倾角：靠这三个数把走道接上，不动排距 ──
     排距 1725 由店宽和洗墙要求焊死，不能改；「中排离边排太远」的感觉，
     本质是两排的光斑在 1.3m 处接不上，中间留了 1.2m 暗带。
     判据：边排光斑半径 + 中排光斑半径 ≥ 排距（1700mm 落差下）
       边36°(552) + 中60°(981) = 1533，地面已完全无缝
       边排倾角从 21° 压到 15°，光锥内沿往走道里多推 300mm */
  /* ══ 光束角是【灯具型号】的物理属性，出厂固定，装完不能调 ══
     同一颗 COB 换不同反光杯 ⇒ 不同光束角。所以「18W 36°」是一个整体型号，
     采购时必须一次性报死。象鼻灯只有【俯仰 0–75°】和【水平 360°】可调，
     光束角不可调 —— 把这里改成下拉选型号，而不是让人随便填数字。 */
  beamRail: 36,     // 边排型号：18W/36°/1500lm —— 洗衣服，光斑1105咬住灯距900
  beamSpot: 24,     // 重点型号：18W/24°/1500lm —— 橱窗模特/首饰柜，更聚光
  beamGen: 60,      // 中排型号：18W/60°/1500lm —— 铺通道，光斑1963罩住排距1725
  tiltSide: 15,     // 边排俯仰角（唯一可调项，15° 时洗墙同时照到走道）

  /* ══ 灯具规格（照度校核的输入，不是可以拍脑袋填的）══ */
  lumen: 1500,      // 单灯光通量 lm（18W COB，光效 83 lm/W）
  watt: 18,         // 单灯功率 W
  cri: 90,          // 显色指数下限
  /* 房间灯单独一款：18W/60°/1500lm，4000K */
  roomWatt: 18,
  roomLumen: 1500,
  roomBeam: 60,

  /* ══ 镜前专用：美颜灯（打脸）+ 美衣灯（打身）══
     装在镜子与站位之间，两只都装在镜面上方横杆或吊顶前沿，朝站位方向打。
     为什么要两只：人脸和身体需要的色温/显色/光型完全不同——
       美颜灯：4000K 中性白、Ra≥95、柔光（扩散板），高位 45° 打脸，消眼下阴影；
       美衣灯：3500K 暖白、Ra≥95、30° 中束，自上而下打全身，突出面料质感。
     显色指数必须 ≥95：普通 90 的灯照衣服，红色会发暗、米色会发灰，
     顾客在镜前看着喜欢的颜色，走到街上就变样，是最容易被投诉的点。 */
  /* 贴镜装后灯到脸的水平距离 = 800 − 100 = 700mm，
     36° 束在 700mm 处光斑约 2×700×tan18° = 455mm，正好罩住一张脸，
     不用死抠 24°（太聚，边缘发暗、眼窝会出硬阴影）。
     脸面实测 1068lx、身面 752lx，比 300lx 标准高得多，但试衣镜前本来就要亮。 */
  beautyWatt: 15, beautyLumen: 1300, beautyBeam: 36, beautyCct: 4000, beautyCri: 95,
  clothWatt: 18,  clothLumen: 1500, clothBeam: 36, clothCct: 3500, clothCri: 95,
  hole: 75,         // 开孔直径
  cct: 3500,        // 色温（营业区暖白）
  roomCct: 4000,    // 房间色温（中性白，看肤色准）
  show: true,
  showBeam: true,
  showSpacing: false
};
 
 /* ══════════════ 元素 ══════════════
    src: cad 图上标注 | std 行业标准 | guess 待确认 | fix 固定结构 | buy 已购实物
    ═══════════════════════════════ */
const ITEMS0 = [
  { id:'wc', name:'卫生间', x:0, y:0, w:1650, d:1200, h:2600, src:'fix', color:'#dfeaea',
    note:'左后角原砌体小间，墙体和门洞不能拆改，只做表面刷漆或贴面。宽 1650、深 1200。' },

  { id:'fit', name:'试衣间', x:0, y:1200, w:1650, d:1100, h:2400, src:'guess', color:'#efe0b4',
    note:'卫生间正下方，同样深 1200、宽 1650。正面挂布帘朝店内开，内装 4000K 灯。' },

  /* 收银台：右靠右墙，从后墙前移 1250mm。
     为什么是 1250：坐人需要的深度 = 凳子/人体 700 + 起身后退 400 + 余量 150。
     原来只留 700，凳子 520 塞进去上下只剩几十毫米，人是进不去的。
     台面 1050 高配高脚凳（坐高 650），膝盖在台下 350 净空。 */
  { id:'cash', name:'收银台', x:3348, y:1000, w:1400, d:600, h:1050, src:'buy', color:'#f7f2e8',
    note:'已购 140×60×105cm。右靠右墙，距后墙 1000 留座位区。台上 1050 配高脚凳坐高 650，台下留 350 容膝。' },

  /* 店员座位：收银台与后墙之间的坐人区，570×570 是能转身进出的最小尺寸 */
  { id:'seat', name:'店员座位', x:3935, y:175, w:600, d:620, h:650, src:'std', color:'#e8e2d5', seat:true,
    note:'收银台后座位区 600×620（人体+凳子+起身余量）。这块必须留空、不能堆货，否则人坐不进去。紧贴右墙。' },

  /* 全身镜：1m 宽，斜 45° 架在左下弧角，镜面朝店内（右上方向）。
     人站在镜前约 800mm 的空地上，面朝角落，背后是临街玻璃——街光打在背上当轮廓，
     镜前两只射灯补脸，这是能真正照出效果的位置。 */
  { id:'mirror', name:'全身镜', x:280, y:6180, w:1000, d:80, h:1800, rot:46.6, src:'std', color:'#d6e8f2',
    /* 站位不写死坐标，由「镜心 + 法线 × 距离」推出来。
       写死坐标的问题是：镜子角度一改（38°→46.6°），站位还停在老地方，
       人就站歪了，看镜子是侧脸；两灯连线中点也会跟着偏离法线。
       用 standDist 一个数驱动，改镜子角度/距离时站位自动跟着走。 */
    standDist:800,

/* ══════════════ 灯位计算 ══════════════ */
function drop(){ return (SHOP.H - LG.aimH); }
function beamRadius(beam){
  return drop()/1000 * Math.tan(beam/2*Math.PI/180) * 1000;
}

/* ══ 市售真实型号表：光束角与功率、光通量绑定，不能拆开 ══
   光效按 83 lm/W（18W COB 常规档）。同一瓦数换反光杯 ⇒ 光通量略有差异，
   但光束角越小，中心光强越高、边缘越暗，这是几何决定的。 */
const FIXTURES = [
  {w:12, b:24, lm:1000}, {w:12, b:36, lm:950},
  {w:15, b:24, lm:1250}, {w:15, b:36, lm:1200}, {w:15, b:60, lm:1150},
  {w:18, b:24, lm:1550}, {w:18, b:36, lm:1500}, {w:18, b:45, lm:1450}, {w:18, b:60, lm:1400},
  {w:24, b:36, lm:2000}, {w:24, b:45, lm:1950}, {w:24, b:60, lm:1900},
];
function fixtureOf(beam){
  /* 选中光束角后，返回最接近的型号（同光束角优先取 18W 档） */
  const exact=FIXTURES.filter(f=>f.b===beam);
  if(exact.length){
    const pref=exact.find(f=>f.w===18) || exact[0];
    return pref;
  }
  return FIXTURES.reduce((a,f)=>Math.abs(f.b-beam)<Math.abs(a.b-beam)?f:a);
}
function beamOptions(cur){
  const beams=[...new Set(FIXTURES.map(f=>f.b))].sort((a,b)=>a-b);
  return beams.map(b=>{
    const f=fixtureOf(b);
    return `<option value="${b}" ${b===cur?'selected':''}>${b}° · ${f.w}W · ${f.lm}lm</option>`;
  }).join('');
}

/* ══ 照度校核：流明法（照明设计手册标准方法）══
   E_avg = Φ_total × UF × MF / A
   UF 利用系数：营业区室形指数 K=1.65 ⇒ 0.65；小房间 K=0.42 ⇒ 0.50
   MF 维护系数 0.8（商业空间，半年清洁一次）
   目标：营业区一般照明 ≥300lx（GB/T 50034 商店营业厅） */
function lumenMethod(){
  const wc=ITEMS.find(i=>i.id==='wc'), ft=ITEMS.find(i=>i.id==='fit');
  const A_room=((wc?wc.w*wc.d:0)+(ft?ft.w*ft.d:0))/1e6;
  const A_shop=(SHOP.W*SHOP.D)/1e6 - A_room;
  const MF = 0.80;
  const lights = computeLights();
  /* 只算营业区的一般照明：镜前美颜/美衣灯是垂直面重点照明，不属于地面照度 */
  const shopL = lights.filter(l=>!l.room && !l.mirrorLight);
  const totalLm = shopL.reduce((s,l)=>s+(l.lm||LG.lumen), 0);
  const E_shop = totalLm*0.65*MF/Math.max(A_shop,1);
  const rooms = [{name:'卫生间',it:wc},{name:'试衣间',it:ft}].filter(d=>d.it).map(def=>{
    const A=(def.it.w*def.it.d)/1e6;
    const E=LG.roomLumen*0.50*MF/Math.max(A,1);
    return {name:def.name, A, E};
  });
  /* 镜前两只灯的垂直面照度（人脸 1.6m、身体 1.0m）。
     灯贴镜装：灯心离镜面 100mm，站位离镜 800mm ⇒ 灯到人的水平距离 700mm。
     这个距离是硬约束——不是随便取的：
       灯离镜太远（如 580）→ 光从头顶斜下来，眼窝、鼻下、下巴会出硬阴影，
       照出来脸是「凶」的；贴镜装等于正前方补光，阴影被压到最小。
       斜距：脸 sqrt(1.4²+0.70²)=1.565m；身 sqrt(2.0²+0.70²)=2.119m */
  /* ⚠ 镜前灯是窄光束重点照明，不能用面均分的流明法（会把光摊到整个房间，严重低估）。
     正确用光强法：I0 = Φ / Ω，Ω = 2π(1−cos(θ/2))，再除距离平方。
     中心照度 E_center = I0·MF/d²；光锥内平均约为中心的一半（余弦衰减）。 */
  const mirLights = lights.filter(l=>l.mirrorLight).map(l=>{
    const h = l.zone==='美颜灯' ? 1600 : 1000;      /* 目标面高：脸 1.6m、身中部 1.0m */
    const dz = (SHOP.H - h)/1000;                  /* 3.0m 吊顶到目标面，单位 m */
    /* 水平距离 = 站位离镜 − 灯离镜 = 800 − 100 = 700mm（跟着镜子几何走，不写死） */
    const mg0 = mirrorGeom();
    const horiz = mg0 ? Math.max(0.1, (mg0.dist - 100)/1000) : 0.70;
    const dist = Math.hypot(dz, horiz);            /* 斜距 */
    const lm = l.lm || LG.lumen;
    const omega = 2*Math.PI*(1-Math.cos(l.beam/2*Math.PI/180));   /* 立体角 sr */
    const I0 = lm/omega;                           /* 中心光强 cd */
    const E = I0*MF/(dist*dist);                   /* 中心照度 lx */
    return {zone:l.zone, lm, beam:l.beam, E, Eavg:E/2, h, dist};
  });
  return {A_shop, A_room, E_shop, rooms, totalLm, n_shop:shopL.length, mirLights};
}
/* 象鼻灯俯仰角：灯心离墙 wallOff，落到目标高 aimH 时打到墙面所需角度 */
function tiltFor(off){ return Math.atan(off/drop())*180/Math.PI; }
/* 边排俯仰角：独立参数，不再绑定「光轴打到墙上1.3m」那个几何角。
   压低到 15° 后，光锥内沿往走道多推约 300mm，走道和中排接得上。 */
function tiltSide(){ return LG.tiltSide; }

/* ── 三排网格几何 ──
   三排：左 / 中 / 右，中排严格居中 ⇒ 左右排距相等，横向天然对齐。
   列：沿进深方向从 rowStart 到 D-rowEnd 均分，三排共用同一组 Y 坐标 ⇒ 纵向严格对齐。
   位置是"算"出来的，不是一个个摆出来的——所以永远对齐、永远等距。 */
/* ══════════ 排数：3 排 或 4 排 ══════════
   3 排时开间 4750 被切成 (W-2·sideOff)/2，而单灯 36° 光斑只有 1105，
   两排之间留 620 的暗带（实测 y=3400 横切面谷值只有峰值 39%），
   顾客走在两条灯带中间时，脸和衣服是青灰色的，试衣服最忌讳这个。
   4 排把开间切成 (W-2·sideOff)/3 三段，36°/60° 光斑 1105/1963 都能咬住，
   暗带从 667 收到 108，代价是营业区从 16 只增到 20 只。 */
function gridRows(){
  const {W}=SHOP;
  if(LG.rowCount===4){
    const span=W-2*LG.sideOff, step=span/3;
    return [LG.sideOff, LG.sideOff+step, LG.sideOff+2*step, W-LG.sideOff];
  }
  return [LG.sideOff, W/2, W-LG.sideOff];
}
/* 外排（洗墙/洗衣服）用 900 密排，光斑 1105 咬合；
   内排（铺通道）用 1200，60° 光斑 1963 足够覆盖，少排一只省电。 */
function gridCols(inner){
  const span = SHOP.D - LG.rowEnd - LG.rowStart;
  const want = (LG.rowCount===4 && inner) ? LG.spacingInner : LG.spacing;
  const n = Math.max(2, Math.round(span/want));
  const step = span/n;
  const cols=[];
  for(let i=0;i<n;i++) cols.push(LG.rowStart + step*(i+0.5));
  return {cols, step, n};
}
function inRect(x,y,it){ return it && x>=it.x && x<=it.x+it.w && y>=it.y && y<=it.y+it.d; }

/* ══════════ 全身镜的站位 / 灯位：全部由镜心 + 法线推算 ══════════
   镜子斜放 rot°，镜身长轴 u=(cosθ,sinθ)，镜面朝店内的法线 n=(sinθ,−cosθ)。
   镜前的一切（站位、美颜灯、美衣灯）都必须落在这条法线上，否则：
     · 人站着是侧对镜子，照不出正脸；
     · 两只灯连线的中点偏离法线，一侧脸亮一侧脸暗。
   所以这里不存死坐标，只存「离镜多远」，坐标现算。 */
function mirrorGeom(){
  const m = ITEMS.find(i=>i.id==='mirror');
  if(!m) return null;
  const th=(m.rot||0)*Math.PI/180;
  const ux=Math.cos(th), uy=Math.sin(th);          /* 沿镜身（镜子上边沿方向） */
  const nx=Math.sin(th), ny=-Math.cos(th);         /* 镜面法线，指向店内站位 */
  const cx=m.x+m.w/2, cy=m.y+m.d/2;                /* 镜心 */
  const dist = m.standDist||800;
  return {
    m, th, ux, uy, nx, ny, cx, cy, dist,
    stand: {x: cx+nx*dist, y: cy+ny*dist},         /* 站位：镜心沿法线出去 dist */
    /* 两灯：站位再往镜子退 back，然后沿镜身各偏 side。
       退 back 保证灯在「镜与站位之间」；偏 side 让两灯形成小夹角，
       且中点必然在法线上（对称偏移，沿 u 的分量互相抵消）。 */
    lights(back, side){
      const bx=this.stand.x-nx*back, by=this.stand.y-ny*back;
      return [
        {x:bx-ux*side, y:by-uy*side},
        {x:bx+ux*side, y:by+uy*side}
      ];
    }
  };
}

function computeLights(){
  const L=[];
  const rRail=beamRadius(LG.beamRail), rSpot=beamRadius(LG.beamSpot), rGen=beamRadius(LG.beamGen);
  const {W}=SHOP;
  const rows=gridRows();
  const colsOuter=gridCols(false).cols;         /* 外排：900 密排 */
  const colsInner=gridCols(true).cols;          /* 内排：1200（四排时生效） */
  const cols=colsOuter;                          /* 三排仍用这一组 */
  const wc=ITEMS.find(i=>i.id==='wc'), ft=ITEMS.find(i=>i.id==='fit');

  const add=(x,y,beam,zone,extra)=>{
    const r = beam===LG.beamRail?rRail : beam===LG.beamSpot?rSpot : rGen;
    const lm = (extra&&extra.room) ? LG.roomLumen : LG.lumen;
    L.push(Object.assign({x,y,beam,r,zone,lm},extra||{}));
  };

  /* ══════════ 一、营业区：三排对齐网格 ══════════
     ⚠ 关键：卫生间、试衣间是独立隔断的封闭房间，它们的顶面属于房间自己，
       不是营业区吊顶的一部分。所以营业区三排绝不能"穿过"这两个房间——
       落在房间里的格点必须整个删掉，而不是把光束改小硬留在网格里。
       更不能用外面三排的余光去照房间（隔墙挡着，照不进去）。 */
  /* 每一排用哪一组列、什么角色：
     三排 → 边/中/边；四排 → 边/内/内/边
     内排是"铺通道"的 60° 泛光，列距可以放到 1200（光斑 1963 仍咬得住）；
     外排是"洗衣服"的 36° 窄光，必须保持 900，否则光斑 1105 接不上。 */
  const isOuter = ri => (LG.rowCount===4) ? (ri===0||ri===rows.length-1) : (ri!==1);
  rows.forEach((x,ri)=>{
    const myCols = (LG.rowCount===4 && !isOuter(ri)) ? colsInner : colsOuter;
    myCols.forEach(y=>{
      if(inRect(x,y,wc) || inRect(x,y,ft)) return;   /* ← 房间顶上不布营业区的灯 */

      const wallX = isOuter(ri) ? (ri===0 ? 0 : W) : undefined;

      /* ── 中排：一律垂直向下，不许斜 ──
         曾经为了「避免坐沙发时头顶直射」把这盏灯歪 27° 往左投，
         结果光斑中心跑到 x=1500（沙发左缘外 300mm），坐的人脸反而变暗，
         还把斜光甩进左侧走道，破坏三排均匀。
         防晃眼靠灯具的遮光角（深防眩 35°，仰角 55° 以上才看得见光源），
         不靠把灯歪掉——人正常坐着的视线是 0–30°，根本看不到 3m 高的灯。 */
      if(!isOuter(ri)){
        add(x,y,LG.beamGen,(LG.rowCount===4)?(ri===1?'内排①':'内排②'):'中排');
      }else{
        /* 最外侧两排：36° 扫墙洗衣服，向墙倾 15°，衣服上沿形成背景亮带 */
        add(x,y,LG.beamRail, ri===0?'左边排':'右边排', {wallX, aimX:wallX, tilt:LG.tiltSide});
      }
    });
  });

  /* ══════════ 二、独立房间：各自单独布灯 ══════════
     卫生间 1650×1200、试衣间 1650×1100，都是砌体隔断的封闭小间，
     顶面独立、开关独立。各配 1 只 4000K 筒灯（比主光 3500K 冷一点，
     小间里看肤色、看衣服本色更准），45° 下打，独立回路控制。
     这两只灯不属于三排网格，不参与"对齐"约束——它们属于房间。 */
  const ROOMS=[
    {it:wc, zone:'卫生间·独立', cct:4000},
    {it:ft, zone:'试衣间·独立', cct:4000}
  ];
  ROOMS.forEach(r=>{
    if(!r.it) return;
    const cx=r.it.x+r.it.w/2, cy=r.it.y+r.it.d/2;
    add(cx,cy,LG.beamGen,r.zone,{room:true,cct:r.cct});
  });

  /* ══════════ 三、全身镜前：美颜灯 + 美衣灯 ══════════
     用户要求：「全身镜与人照站位之间安装美颜灯和美衣灯，一个打脸一个打身」。
     这两只装在镜子与站位之间，从镜子上方向站位方向打——不是装在站位的头顶，
     而是装在站位「看镜子的那个方向」的对面，这样：
       · 光从镜子一侧射向人，人脸上是被正面光打亮（不是顶光，不会眼下发黑）；
       · 身体被自上而下扫过，面料纹理和垂感看得清；
       · 顾客背后的店内有纵深，背后不背光，剪影清晰。
     位置：沿镜面法线方向，从站位往镜子方向退 220mm（站位离镜 800，灯在离镜 580 处），
     左右各偏 190mm 形成小夹角，避免正面一片死平。 */
  const mg=mirrorGeom();
  if(mg){
    /* 两只灯的坐标由 mirrorGeom 现算：站位沿法线退回到镜前 580，再沿镜身各偏 190。
       因为左右对称偏移，两灯连线的中点必然落在法线上，
       连线方向又恰好等于镜身切向 u ⇒ 与镜子上边沿严格平行。 */
    /* 灯贴镜装：站位离镜 800，往镜子退 700 ⇒ 灯心离镜面 100mm，
       正好卡在镜框上沿内侧，像化妆镜的灯带——不是悬在镜前空中。
       沿镜身各偏 250（两灯间距 500），覆盖脸宽+肩宽。 */
    const [P1,P2]=mg.lights(700,250);
    const tgt={x:mg.stand.x, y:mg.stand.y};   /* 两只都打向站位 */
    add(P1.x,P1.y,LG.beautyBeam,'美颜灯',
        {mirrorLight:true, cct:LG.beautyCct, cri:LG.beautyCri, lm:LG.beautyLumen,
         watt:LG.beautyWatt, aim:tgt, sub:'打脸'});
    add(P2.x,P2.y,LG.clothBeam,'美衣灯',
        {mirrorLight:true, cct:LG.clothCct, cri:LG.clothCri, lm:LG.clothLumen,
         watt:LG.clothWatt, aim:tgt, sub:'打身'});
  }

  return L;
}

function drawBeams(){
  gBeam.innerHTML='';
  gBeam.style.display = (LG.show&&LG.showBeam)?'':'none';
  if(!LG.show||!LG.showBeam) return;
  computeLights().forEach(l=>{
    /* 独立房间的灯用青灰调，和营业区暖黄一眼区分开：
       让人看图就明白「这两只是房间自己的，不属于三排」 */
    const isRoom=!!l.room, isMir=!!l.mirrorLight;
    /* 三种语义配色：营业区暖黄 / 独立房间青灰 / 镜前专用青绿（美颜浅绿、美衣黄绿） */
    const fill = isRoom ? 'rgba(150,200,205,.16)'
      : isMir ? (l.zone==='美颜灯' ? 'rgba(110,200,168,.18)' : 'rgba(168,200,110,.18)')
      : (l.beam===LG.beamSpot?'rgba(255,196,70,.20)':(l.beam===LG.beamRail?'rgba(255,214,120,.15)':'rgba(255,232,170,.11)'));
    const stroke = isRoom ? '#4f9aa0'
      : isMir ? (l.zone==='美颜灯' ? '#4fa886' : '#8aa84f')
      : (l.beam===LG.beamSpot?'#e8a72c':(l.beam===LG.beamRail?'#dfb85a':'#e2c98a'));
    mk('circle',{cx:l.x,cy:l.y,r:l.r,fill,stroke,
      'stroke-width': (isRoom||isMir)?6:4,'stroke-opacity':.55,'stroke-dasharray': (isRoom||isMir)?'24 12':'16 14'},gBeam);
  });
}

function drawLights(){
  gLight.innerHTML='';
  gLight.style.display = LG.show?'':'none';
  if(!LG.show) return;

  const ls=computeLights();
  ls.forEach((l,i)=>{
    const g=mk('g',{},gLight);
    // 打光方向：指向墙面目标（体现象鼻灯可调角）
    if(l.aimX!==undefined){
      mk('line',{x1:l.x,y1:l.y,x2:l.aimX,y2:l.y,stroke:'#c9922b','stroke-width':9,'stroke-dasharray':'20 14','stroke-opacity':.75},g);
      mk('circle',{cx:l.aimX,cy:l.y,r:12,fill:'#c9922b'},g);
    }
    if(l.aimY!==undefined){
      mk('line',{x1:l.x,y1:l.y,x2:l.x,y2:l.aimY,stroke:'#c9922b','stroke-width':9,'stroke-dasharray':'20 14','stroke-opacity':.75},g);
      mk('circle',{cx:l.x,cy:l.aimY,r:12,fill:'#c9922b'},g);
    }
    if(l.room){
      /* 独立房间灯：青色 + 外圈虚线环，图上和营业区三排明显不同 */
      mk('circle',{cx:l.x,cy:l.y,r:62,fill:'#8cc6cb',stroke:'#2f7378','stroke-width':8},g);
      mk('circle',{cx:l.x,cy:l.y,r:86,fill:'none',stroke:'#2f7378','stroke-width':6,'stroke-dasharray':'18 14','stroke-opacity':.8},g);
      mk('circle',{cx:l.x,cy:l.y,r:24,fill:'#f2fbfc'},g);
      tx(g,l.x,l.y+126,String(i+1),{fill:'#1f5d61','font-size':50,'text-anchor':'middle','font-weight':700,
        'paint-order':'stroke',stroke:'#fff','stroke-width':11,'stroke-opacity':.95});
    }else if(l.mirrorLight){
      /* 镜前专用灯：青绿双色区分美颜/美衣，方形灯体区别于圆筒灯，并画打光方向 */
      const isB = l.zone==='美颜灯';
      const main = isB ? '#6ec8a8' : '#a8c86e';
      const dark = isB ? '#2f7a5e' : '#6a7a2f';
      mk('rect',{x:l.x-58,y:l.y-58,width:116,height:116,rx:16,fill:main,stroke:dark,'stroke-width':8},g);
      mk('rect',{x:l.x-26,y:l.y-26,width:52,height:52,rx:8,fill:'#f4fff9'},g);
      /* 打光方向：朝站位 */
      if(l.aim){
        const dx=l.aim.x-l.x, dy=l.aim.y-l.y, L=Math.hypot(dx,dy)||1;
        mk('line',{x1:l.x+dx/L*70,y1:l.y+dy/L*70,x2:l.x+dx/L*(L-40),y2:l.y+dy/L*(L-40),
          stroke:dark,'stroke-width':7,'stroke-dasharray':'20 16','stroke-opacity':.85},g);
        const ax=l.x+dx/L*(L-40), ay=l.y+dy/L*(L-40);
        const ang=Math.atan2(dy,dx)*180/Math.PI;
        mk('path',{d:'M 0 0 l -34 -18 l 0 36 z',fill:dark,
          transform:`translate(${ax} ${ay}) rotate(${ang})`},g);
      }
      tx(g,l.x,l.y-84,isB?'美颜':'美衣',{fill:dark,'font-size':46,'text-anchor':'middle','font-weight':700,
        'paint-order':'stroke',stroke:'#fff','stroke-width':10,'stroke-opacity':.95});
      tx(g,l.x,l.y+140,String(i+1),{fill:dark,'font-size':46,'text-anchor':'middle','font-weight':700,
        'paint-order':'stroke',stroke:'#fff','stroke-width':10,'stroke-opacity':.95});
    }else{
      mk('circle',{cx:l.x,cy:l.y,r:62,fill:l.beam===LG.beamSpot?'#f0b83a':(l.beam===LG.beamRail?'#f3cd6e':'#f0d79a'),stroke:'#8a6a22','stroke-width':8},g);
      mk('circle',{cx:l.x,cy:l.y,r:24,fill:'#fff8e0'},g);
      /* 灯号加白描边：灯位图层在最上层，压在元素名上也能读清 */
      tx(g,l.x,l.y+126,String(i+1),{fill:'#7a5c18','font-size':50,'text-anchor':'middle','font-weight':700,
        'paint-order':'stroke',stroke:'#fff','stroke-width':11,'stroke-opacity':.95});
    }
  });

  /* 两灯平行参考虚线：画在灯体之后，保证不被方形灯压住。
     这条线就是「两灯连线」本身，方向和镜身切向完全一致，
     图上看到它平行于镜子上边沿，就等于看到了平行关系的证据。 */
  /* 这里必须自己算一遍几何，不能依赖 drawItems 先跑：
     redraw() 里灯位图层可能先于元素图层绘制，那时 MIRROR_REF 还是 null，
     参考线就画不出来（曾因此出现「代码写了但图上没有」）。 */
  const MG = mirrorGeom();
  if(MG){
    const [L1,L2]=MG.lights(700,250);
    mk('line',{x1:L1.x,y1:L1.y,x2:L2.x,y2:L2.y,stroke:'#2f7a5e','stroke-width':7,
      'stroke-dasharray':'20 14','stroke-opacity':.95},gLight);
    /* 法线：从两灯中点垂直打到镜心，再延伸到站位 */
    const mx=(L1.x+L2.x)/2, my=(L1.y+L2.y)/2;
    const S=MG.stand;
    mk('line',{x1:S.x,y1:S.y,x2:MG.cx,y2:MG.cy,stroke:'#2f7a5e',
      'stroke-width':6,'stroke-dasharray':'20 14','stroke-opacity':.8},gLight);
    /* 直角符号：在两灯连线与法线交点处画一个小方框，直观表示垂直 */
    const sg = ((S.x-mx)>=0?1:-1);
    const px=MG.nx*sg, py=MG.ny*sg;
    const q=46;
    mk('path',{d:`M ${mx+MG.ux*q} ${my+MG.uy*q}
                  L ${mx+MG.ux*q+px*q} ${my+MG.uy*q+py*q}
                  L ${mx+px*q} ${my+py*q}`,
      fill:'none',stroke:'#2f7a5e','stroke-width':5,'stroke-opacity':.9},gLight);
  }

  const nMir=ls.filter(l=>l.mirrorLight).length;
  const nRoom=ls.filter(l=>l.room).length;
  const nShop=ls.length-nRoom-nMir;
  const wTotal = nShop*LG.watt + nRoom*LG.roomWatt
               + ls.filter(l=>l.zone==='美颜灯').length*LG.beautyWatt
               + ls.filter(l=>l.zone==='美衣灯').length*LG.clothWatt;
  /* 按实际排数报数：3 排时是"左/中/右"，4 排时是"左/内/内/右"，
     不能写死"三排"，否则改了 rowCount 图上的字就跟灯对不上。 */
  const rowX=gridRows(), nR=rowX.length;
  const shopL=ls.filter(l=>!l.room&&!l.mirrorLight);
  const perRow=rowX.map(x=>shopL.filter(l=>Math.abs(l.x-x)<1).length);
  const rowLabel=nR===4?['左','内①','内②','右']:['左','中','右'];
  const rowTxt=rowX.map((x,i)=>`${rowLabel[i]}${perRow[i]}`).join('/');
  const pitchesTxt=(()=>{const p=[];for(let i=1;i<nR;i++)p.push(Math.round(rowX[i]-rowX[i-1]));return p.join('/')})();
  tx(gLight,SHOP.W/2,SHOP.D+PADBOT-330,
    `灯具 ${ls.length} 只 ＝ 营业区 ${nR}排 ${nShop}（${rowTxt}）＋ 房间 ${nRoom} ＋ 镜前 ${nMir} · 共 ${wTotal}W`,
    {fill:'#8a6a22','font-size':64,'text-anchor':'middle','font-weight':600});
  tx(gLight,SHOP.W/2,SHOP.D+PADBOT-240,
    `${nR}排 X=${rowX.map(v=>Math.round(v)).join('/')} · 排距 ${pitchesTxt} · 外排灯距 ${Math.round(gridCols(false).step)}`
    + (nR===4?` / 内排 ${Math.round(gridCols(true).step)}`:'')
    + ` · 外排光束${LG.beamRail}° 向墙倾${tiltSide().toFixed(0)}° · ${nR===4?'内排':'中排'}光束${LG.beamGen}° 垂直`,
    {fill:'#a89a68','font-size':56,'text-anchor':'middle'});
  tx(gLight,SHOP.W/2,SHOP.D+PADBOT-150,
    `${LG.watt}W · ${LG.lumen}lm · ${LG.cct}K · Ra≥${LG.cri} · 营业区平均 ${Math.round(lumenMethod().E_shop)}lx（≥300）· 房间 ${LG.roomWatt}W ${LG.roomCct}K`,
    {fill:'#8a9a68','font-size':56,'text-anchor':'middle','font-weight':600});
  tx(gLight,SHOP.W/2,SHOP.D+PADBOT-60,
    `卫生间 / 试衣间：砌体隔断的独立封闭空间，各配 1 只 4000K 筒灯、独立开关（青色圆点），不并入营业区网格`,
    {fill:'#2f7378','font-size':56,'text-anchor':'middle','font-weight':600});
}

/* ══════════════ 灯距 / 离墙距离 标注 ══════════════ */
function drawSpacing(){
  gSpacing.innerHTML='';
  gSpacing.style.display = (LG.show&&LG.showSpacing)?'':'none';
  if(!LG.show||!LG.showSpacing) return;

  const ls=computeLights();
  const byZone={};
  ls.forEach(l=>{ (byZone[l.zone]=byZone[l.zone]||[]).push(l); });

  /* 尺寸线：两点之间画线 + 端点短撇 + 数字 */
  const dimLine=(x1,y1,x2,y2,label,off)=>{
    if(Math.abs(x1-x2)<2&&Math.abs(y1-y2)<2) return;
    mk('line',{x1,y1,x2,y2,stroke:'#c9922b','stroke-width':6,'stroke-opacity':.85},gSpacing);
    const vert=Math.abs(x1-x2)<Math.abs(y1-y2);
    [[x1,y1],[x2,y2]].forEach(([x,y])=>{
      if(vert) mk('line',{x1:x-26,y1:y,x2:x+26,y2:y,stroke:'#c9922b','stroke-width':6,'stroke-opacity':.85},gSpacing);
      else mk('line',{x1:x,y1:y-26,x2:x,y2:y+26,stroke:'#c9922b','stroke-width':6,'stroke-opacity':.85},gSpacing);
    });
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const t=tx(gSpacing,mx,my,label,{fill:'#a8741c','font-size':52,'text-anchor':'middle','font-weight':700,
      'paint-order':'stroke',stroke:'#fff','stroke-width':11,'stroke-opacity':.95});
    if(vert) t.setAttribute('transform',`rotate(-90 ${mx} ${my})`);
  };

  /* 每列灯：相邻间距 + 到墙距离 */
  Object.keys(byZone).forEach(z=>{
    const g=byZone[z];
    if(g.length<1) return;
    const xs=g.map(l=>l.x), ys=g.map(l=>l.y);
    const spanX=Math.max(...xs)-Math.min(...xs);
    const spanY=Math.max(...ys)-Math.min(...ys);
    const alongY = spanY>=spanX;

    // 是否贴墙列（由灯自身的方向线判断）
    const toWall = g[0].wallX!==undefined ? g[0].wallX : null;

    if(alongY){
      const sx=g[0].x;
      const sorted=[...g].sort((a,b)=>a.y-b.y);
      // 到墙距离（只在第一只灯处标一次）
      if(toWall!==null){
        dimLine(sx, sorted[0].y, toWall, sorted[0].y, String(LG.sideOff), 0);
      }
      // 相邻间距
      const nodeOff = toWall===0 ? 165 : -165;
      for(let i=1;i<sorted.length;i++){
        dimLine(sx+nodeOff, sorted[i-1].y, sx+nodeOff, sorted[i].y, String(Math.round(sorted[i].y-sorted[i-1].y)), 0);
      }
    }else{
      const sy=g[0].y;
      const sorted=[...g].sort((a,b)=>a.x-b.x);
      if(toWall!==null){
        dimLine(sorted[0].x, sy, sorted[0].x, toWall, String(LG.sideOff), 0);
      }
      for(let i=1;i<sorted.length;i++){
        dimLine(sorted[i-1].x, sy+165, sorted[i].x, sy+165, String(Math.round(sorted[i].x-sorted[i-1].x)), 0);
      }
    }
  });

  /* ══════════ 横向排距：中排到左右排的距离 ══════════
     用户原话：「你的灯距要把中间排灯离两边排灯的距离也画上呀」
     纵向灯距（相邻两灯的间距）之前已经画了，但横向排距一直没标，
     看图上三排之间是空的，不知道排距到底多少。
     画在最后一列灯的下一行（y = 末列 + 620），避开纵向尺寸线。 */
  const gRows=gridRows();
  const allCols=gridCols().cols;
  const lastCol=Math.max(...allCols);
  const ry=lastCol+620;
  /* 排距由下面逐段计算 */

  /* 三排 X 的竖向引线（虚线），从最后一列灯往下引到排距尺寸线 */
  gRows.forEach(x=>{
    mk('line',{x1:x,y1:lastCol+70,x2:x,y2:ry-24,stroke:'#c9922b','stroke-width':4,
      'stroke-dasharray':'16 14','stroke-opacity':.6},gSpacing);
  });

  /* 相邻两排之间的排距，逐段画 */
  for(let i=1;i<gRows.length;i++){
    dimLine(gRows[i-1], ry, gRows[i], ry, String(Math.round(gRows[i]-gRows[i-1])), 0);
  }

  /* 标注说明：按实际排数报，别写死"三排居中" */
  const nRow=gRows.length;
  const pitches=[]; for(let i=1;i<nRow;i++) pitches.push(Math.round(gRows[i]-gRows[i-1]));
  const allEq = pitches.every(v=>Math.abs(v-pitches[0])<=1);
  const pitchTxt = allEq ? `${pitches[0]}（${nRow} 排严格等距）` : pitches.join(' / ') + '（不等距，需调整）';
  tx(gSpacing,(gRows[0]+gRows[nRow-1])/2, ry+118,
    `横向排距：${pitchTxt}　·　排 X＝${gRows.map(v=>Math.round(v)).join(' / ')}`,
    {fill:'#a8741c','font-size':52,'text-anchor':'middle','font-weight':700,
     'paint-order':'stroke',stroke:'#fff','stroke-width':11,'stroke-opacity':.95});

  // 俯仰角说明
  tx(gSpacing,-PADX+40,-PADTOP+90,
    `象鼻灯可调：俯仰 0–${LG.tiltMax}°、水平 360°。当前灯心离墙 ${LG.sideOff}，需俯仰 ${tiltSide().toFixed(0)}°`,
    {fill:'#a8741c','font-size':54,'font-weight':600});
}

/* ══════════════ 元素 ══════════════ */
function drawItems(){
  gItem.innerHTML=''; gRef.innerHTML='';

  ITEMS.forEach(it=>{
    const isSel = it.id===selId;
    const target = it.isRef ? gRef : gItem;
    const g=mk('g',{},target);
    g.style.cursor='move';

    /* 斜放元素（如全身镜 rot）：整体绕自身中心旋转，几何和点击区域一起转 */
    if(it.rot){
      const rcx=it.x+it.w/2, rcy=it.y+it.d/2;
      g.setAttribute('transform',`rotate(${it.rot} ${rcx} ${rcy})`);
    }

    const r=mk('rect',{x:it.x,y:it.y,width:it.w,height:it.d,fill:it.color,
      stroke:isSel?'#c8892b':(it.src==='fix'?'#a85a5a':(it.isRef?'#c9a227':'#8a8172')),
      'stroke-width':isSel?20:(it.isRef?9:10),rx:it.isRef?26:12},g);
    if(it.src==='fix') r.setAttribute('stroke-dasharray','42 26');
    if(it.isRef) r.setAttribute('stroke-dasharray','50 34');

    // 衣架：画出横杆实际长度
    if(it.rail){
      const horiz = it.d>it.w;
      if(horiz){
        const oy = it.y + it.overhang;
        mk('line',{x1:it.x+it.w*0.2,y1:oy,x2:it.x+it.w*0.2,y2:oy+it.rail,stroke:'#8a6a3a','stroke-width':13},g);
        mk('line',{x1:it.x+it.w*0.8,y1:oy,x2:it.x+it.w*0.8,y2:oy+it.rail,stroke:'#8a6a3a','stroke-width':13},g);
      }else{
        const ox = it.x + it.overhang;
        mk('line',{x1:ox,y1:it.y+it.d*0.2,x2:ox+it.rail,y2:it.y+it.d*0.2,stroke:'#8a6a3a','stroke-width':13},g);
      }
    }

    const cx=it.x+it.w/2, cy=it.y+it.d/2;
    const vertical = it.d > it.w*1.4;
    const fs=Math.min(76,Math.max(44,Math.min(it.w,it.d)*0.125));
    const t=tx(g,cx,cy,it.name,{fill:it.isRef?'#9a7d20':(isSel?'#7a4f10':'#4a443c'),
      'font-size':isSel?fs:fs*0.88,'text-anchor':'middle','font-weight':isSel?700:500,
      'paint-order':'stroke',stroke:'#fff','stroke-width':11,'stroke-opacity':.9});
    if(vertical) t.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);

    /* 店员座位：画成圆凳 + 面朝方向，一眼看出这里是坐人的 */
    if(it.seat){
      const ccx=it.x+it.w/2, ccy=it.y+it.d/2, cr=Math.min(it.w,it.d)*0.42;
      mk('circle',{cx:ccx,cy:ccy,r:cr,fill:'#f5efe2',stroke:'#b9a98d','stroke-width':12},g);
      mk('circle',{cx:ccx,cy:ccy,r:cr*0.55,fill:'#e8dcc4',stroke:'#c9b898','stroke-width':6},g);
      // 面朝店内（向下 = 门面方向）
      mk('path',{d:`M ${ccx-46} ${ccy+cr*0.55} L ${ccx+46} ${ccy+cr*0.55} L ${ccx} ${ccy+cr*0.55+62} Z`,
        fill:'#a89476'},g);
      tx(g,ccx,ccy+14,'坐',{fill:'#7d6a4a','font-size':54,'text-anchor':'middle','font-weight':700});
    }

    /* 全身镜：镜面朝店内，标出站位 */
    if(it.id==='mirror'){
      const mx=it.x+it.w/2, my=it.y+it.d/2;
      // 镜面（朝店内一侧）用亮蓝描一条
      mk('line',{x1:it.x+40,y1:it.y+it.d,x2:it.x+it.w-40,y2:it.y+it.d,
        stroke:'#6fa8c8','stroke-width':16},g);
      /* 站位与两只灯全部由 mirrorGeom 现算，图上画的和灯位算的用同一套坐标，
         绝不会出现「图上画的站位」和「灯对着的站位」不一致。 */
      const mg = (it.id==='mirror') ? mirrorGeom() : null;
      if(mg){
        const S=mg.stand;
        mk('circle',{cx:S.x,cy:S.y,r:96,fill:'rgba(111,168,200,.16)',
          stroke:'#5b93b3','stroke-width':7,'stroke-dasharray':'24 16'},g);
        tx(g,S.x,S.y+22,'站位',{fill:'#3f7391','font-size':52,'text-anchor':'middle','font-weight':700});
        /* 站位到镜心的连线＝镜面法线，必须垂直打在镜面上，
           否则人站的位置是斜的，看镜子里自己是侧脸，照不出效果 */
        mk('line',{x1:S.x,y1:S.y,x2:mg.cx,y2:mg.cy,stroke:'#5b93b3','stroke-width':6,
          'stroke-dasharray':'18 14','stroke-opacity':.7},g);
        /* 站位正对方向：人面朝镜面的朝向箭头（脚尖方向，朝镜子） */
        const ax=-mg.nx, ay=-mg.ny;                    /* 从站位指向镜子 */
        const px=S.x+ax*96, py=S.y+ay*96;
        const qx=S.x+ax*168, qy=S.y+ay*168;
        mk('line',{x1:px,y1:py,x2:qx,y2:qy,stroke:'#3f7391','stroke-width':9,'stroke-opacity':.9},g);
        mk('path',{d:'M 0 0 l -26 -16 l 0 32 z',fill:'#3f7391',
          transform:`translate(${qx} ${qy}) rotate(${Math.atan2(ay,ax)*180/Math.PI})`},g);
        /* 两灯连线的参考虚线统一在 drawLights() 里画（灯位图层最上），
           这里不再重复画，否则会出现两条同色线叠在一起。 */
        /* 站位离镜距离 */
        tx(g,(S.x+mg.cx)/2+mg.ux*150,(S.y+mg.cy)/2+mg.uy*150,
          '站位离镜 '+Math.round(mg.dist),
          {fill:'#3f7391','font-size':44,'text-anchor':'middle','font-weight':600,
           'paint-order':'stroke',stroke:'#fff','stroke-width':10,'stroke-opacity':.92});
      }
    }

    if(it.faceLeft){
      const ay=it.y+it.d/2;
      mk('line',{x1:it.x+it.w*0.35,y1:ay,x2:it.x-150,y2:ay,stroke:'#9a7a20','stroke-width':15},g);
      mk('path',{d:`M ${it.x-150} ${ay} l 92 -34 l 0 68 z`,fill:'#9a7a20'},g);
      tx(g,it.x-180,ay-44,'朝左窗',{fill:'#9a7a20','font-size':56,'text-anchor':'end','font-weight':700});
    }

    if(isSel&&!it.isRef){
      mk('rect',{x:it.x+it.w-46,y:it.y+it.d-46,width:92,height:92,fill:'#c8892b',stroke:'#fff','stroke-width':12,rx:12,class:'handle'},g);
      mk('rect',{x:it.x-8,y:it.y-8,width:it.w+16,height:it.d+16,fill:'none',stroke:'#c8892b','stroke-width':7,'stroke-dasharray':'26 18','stroke-opacity':.8},g);
    }

    g.addEventListener('pointerdown',ev=>{
      select(it.id);
      if(it.isRef) return;
      ev.preventDefault();
      const p0=toSvg(ev), ox=it.x, oy=it.y, ow=it.w, od=it.d;
      const onHandle = ev.target.classList && ev.target.classList.contains('handle');
      g.setPointerCapture(ev.pointerId);
      const move=e2=>{
        const p=toSvg(e2), dx=p.x-p0.x, dy=p.y-p0.y;
        if(onHandle){ it.w=Math.max(80,snap(ow+dx)); it.d=Math.max(60,snap(od+dy)); }
        else { it.x=snap(ox+dx); it.y=snap(oy+dy); }
        redraw(); syncForm();
      };
      const up=()=>{ g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); validate(); save(); };
      g.addEventListener('pointermove',move); g.addEventListener('pointerup',up);
    });
  });

  gRef.style.display = showRef?'':'none';
}

/* ══════════════ 选中态：虚线定位 + 长宽标注 ══════════════ */
function drawAnno(){
  gAnno.innerHTML='';
  const it = ITEMS.find(i=>i.id===selId);
  if(!it || it.isRef) return;

  const DASH='34 22';
  const dimTxt=(x,y,s,anchor,rot)=>{
    const t=tx(gAnno,x,y,s,{fill:'#b8761a','font-size':62,'text-anchor':anchor||'middle','font-weight':700,
      'paint-order':'stroke',stroke:'#fff','stroke-width':13,'stroke-opacity':.95});
    if(rot) t.setAttribute('transform',`rotate(${rot} ${x} ${y})`);
    return t;
  };
  const tick=(x,y,v)=>{
    if(v) mk('line',{x1:x-30,y1:y,x2:x+30,y2:y,stroke:'#b8761a','stroke-width':7},gAnno);
    else mk('line',{x1:x,y1:y-30,x2:x,y2:y+30,stroke:'#b8761a','stroke-width':7},gAnno);
  };

  const cy = it.y+it.d/2, cx = it.x+it.w/2;

  // 距左墙 X
  mk('line',{x1:0,y1:cy,x2:it.x,y2:cy,stroke:'#b8761a','stroke-width':7,'stroke-dasharray':DASH},gAnno);
  if(it.x>60){ tick(it.x,cy,1); dimTxt(it.x/2,cy-26,String(it.x)); }

  // 距后墙 Y
  mk('line',{x1:cx,y1:0,x2:cx,y2:it.y,stroke:'#b8761a','stroke-width':7,'stroke-dasharray':DASH},gAnno);
  if(it.y>60){ tick(cx,it.y,0); dimTxt(cx-30,it.y/2,String(it.y),'middle',-90); }

  // 宽（矩形下方）
  const by=it.y+it.d+120;
  mk('line',{x1:it.x,y1:it.y+it.d+40,x2:it.x,y2:by+30,stroke:'#b8761a','stroke-width':5,'stroke-dasharray':'18 16','stroke-opacity':.7},gAnno);
  mk('line',{x1:it.x+it.w,y1:it.y+it.d+40,x2:it.x+it.w,y2:by+30,stroke:'#b8761a','stroke-width':5,'stroke-dasharray':'18 16','stroke-opacity':.7},gAnno);
  mk('line',{x1:it.x,y1:by,x2:it.x+it.w,y2:by,stroke:'#b8761a','stroke-width':7},gAnno);
  tick(it.x,by,0); tick(it.x+it.w,by,0);
  dimTxt(cx,by+72,`宽 ${it.w}`);

  // 深（矩形右侧）
  const rx=it.x+it.w+120;
  mk('line',{x1:it.x+it.w+40,y1:it.y,x2:rx+30,y2:it.y,stroke:'#b8761a','stroke-width':5,'stroke-dasharray':'18 16','stroke-opacity':.7},gAnno);
  mk('line',{x1:it.x+it.w+40,y1:it.y+it.d,x2:rx+30,y2:it.y+it.d,stroke:'#b8761a','stroke-width':5,'stroke-dasharray':'18 16','stroke-opacity':.7},gAnno);
  mk('line',{x1:rx,y1:it.y,x2:rx,y2:it.y+it.d,stroke:'#b8761a','stroke-width':7},gAnno);
  tick(rx,it.y,1); tick(rx,it.y+it.d,1);
  dimTxt(rx+70,cy,`深 ${it.d}`,'middle',90);

  // 平面图不标高度：高度数据只在右侧面板里编辑，避免与平面尺寸混淆
}

/* ══════════════ 店铺尺寸（可点击选中） ══════════════ */
function drawDims(){
  gDim.innerHTML='';
  gDim.style.display = showDim?'':'none';
  if(!showDim) return;

  const chain=(key,x1,y1,x2,y2,label)=>{
    if(Math.abs(x1-x2)<2&&Math.abs(y1-y2)<2) return;
    const on = dimSel===key;
    const g=mk('g',{},gDim);
    g.style.cursor='pointer';
    const col = on?'#b8761a':'#b3a894';
    const wdt = on?11:7;
    mk('line',{x1,y1,x2,y2,stroke:col,'stroke-width':wdt},g);
    [[x1,y1],[x2,y2]].forEach(([x,y])=>mk('line',{x1:x-28,y1:y-28,x2:x+28,y2:y+28,stroke:col,'stroke-width':wdt},g));
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const t=tx(g,mx,my,label,{fill:on?'#b8761a':'#7d7466','font-size':on?84:78,'text-anchor':'middle','font-weight':600,
      'paint-order':'stroke',stroke:'#fff','stroke-width':12,'stroke-opacity':.9});
    if(Math.abs(x1-x2)<Math.abs(y1-y2)) t.setAttribute('transform',`rotate(-90 ${mx} ${my})`);
    g.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); dimSel=key; selId=null; drawDims(); drawAnno(); renderPanel(); });
  };

  chain('W',0,-90,SHOP.W,-90,String(SHOP.W));
  chain('D',SHOP.W+90,0,SHOP.W+90,SHOP.D,String(SHOP.D));
  chain('ARCX',0,SHOP.D+90,SHOP.ARCX,SHOP.D+90,String(SHOP.ARCX));
  /* 弧角沿左墙的跨度，竖排在左墙外侧 */
  chain('ARCY',-250,SHOP.D-SHOP.ARCY,-250,SHOP.D,String(SHOP.ARCY));
  /* 尺寸链：150 的窄固玻太窄，尺寸数字会与相邻 1578 叠在一起，
     改为在窄玻璃下方单独用文字标（“窄150”），链上只标三段主尺寸 */
  /* 玻璃三段完整尺寸链：1500 + 900 + 150 闭合。
     150 太窄，把它的数字引到下一行（D+230），避免和相邻数字挤在一起。 */
  chain('G1',SHOP.GX1,SHOP.D+90,SHOP.DX1,SHOP.D+90,String(SHOP.DX1-SHOP.GX1));
  chain('DOOR',SHOP.DX1,SHOP.D+90,SHOP.DX2,SHOP.D+90,String(SHOP.DX2-SHOP.DX1));
  if(SHOP.GX2-SHOP.DX2>20){
    const g2a=SHOP.DX2, g2b=SHOP.GX2;
    const gy=SHOP.D+235;
    mk('line',{x1:g2a,y1:gy,x2:g2b,y2:gy,stroke:'#b3a894','stroke-width':7},gDim);
    [[g2a,gy],[g2b,gy]].forEach(([x,y])=>mk('line',{x1:x-22,y1:y-22,x2:x+22,y2:y+22,stroke:'#b3a894','stroke-width':7},gDim));
    mk('line',{x1:g2a,y1:SHOP.D+90,x2:g2a,y2:gy+16,stroke:'#c9bfae','stroke-width':4,'stroke-dasharray':'18 14'},gDim);
    mk('line',{x1:g2b,y1:SHOP.D+90,x2:g2b,y2:gy+16,stroke:'#c9bfae','stroke-width':4,'stroke-dasharray':'18 14'},gDim);
    tx(gDim,g2b+34,gy+22,String(SHOP.GX2-SHOP.DX2),{fill:'#7d7466','font-size':64,'font-weight':600,
      'paint-order':'stroke',stroke:'#fff','stroke-width':10,'stroke-opacity':.92});
  }
  /* 门右边缘 → 右主墙：这是现场最好量的一项，必须单独标出来 */
  if(SHOP.W-SHOP.DX2>20){
    const a=SHOP.DX2, b=SHOP.W, my=SHOP.D+430;
    mk('line',{x1:a,y1:my,x2:b,y2:my,stroke:'#c07a3a','stroke-width':8},gDim);
    [[a,my],[b,my]].forEach(([x,y])=>{
      mk('line',{x1:x,y1:y-26,x2:x,y2:y+26,stroke:'#c07a3a','stroke-width':8},gDim);
      mk('line',{x1:x,y1:SHOP.D+95,x2:x,y2:my-10,stroke:'#c07a3a','stroke-width':4,'stroke-dasharray':'18 14'},gDim);
    });
    tx(gDim,(a+b)/2,my+62,'门右→右墙 '+Math.round(SHOP.W-SHOP.DX2),
      {fill:'#a8651f','font-size':66,'text-anchor':'middle','font-weight':700,
       'paint-order':'stroke',stroke:'#fff','stroke-width':11,'stroke-opacity':.94});
  }
}

function snap(v){return Math.round(v/SNAP)*SNAP;}
function toSvg(ev){
  const p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

/* ══════════════ 校验 ══════════════ */
function validate(){
  const w=document.getElementById('warn');
  try{ return validateBody(w); }
  catch(e){
    w.className='bad';
    w.innerHTML='<div class="wt">⚠ 校验脚本出错（不影响图纸）</div><ul><li>'
      +String(e.message).replace(/</g,'&lt;')
      +'</li><li>'+String((e.stack||'').split('\n')[1]||'').replace(/</g,'&lt;')+'</li></ul>';
    console.error(e);
  }
}
function validateBody(w){
  const msgs=[], ok=[];
  const real=ITEMS.filter(i=>!i.noCollide);

  for(let a=0;a<real.length;a++)for(let b=a+1;b<real.length;b++){
    const A=real[a],B=real[b];
    if(A.x<B.x+B.w&&A.x+A.w>B.x&&A.y<B.y+B.d&&A.y+A.d>B.y) msgs.push(`${A.name} 与 ${B.name} 重叠`);
  }
  real.forEach(i=>{ if(i.x<-1||i.y<-1||i.x+i.w>SHOP.W+1||i.y+i.d>SHOP.D+1) msgs.push(`${i.name} 超出店铺范围`); });

  const sofa=ITEMS.find(i=>i.id==='sofa'), jew=ITEMS.find(i=>i.id==='jew');
  const hL=ITEMS.find(i=>i.id==='hL1'), hR=ITEMS.find(i=>i.id==='hR1');
  if(sofa&&jew&&hL&&hR){
    const gL=sofa.x-(hL.x+hL.w), gR=hR.x-(jew.x+jew.w);
    if(gL<900) msgs.push(`沙发左侧通道 ${gL}mm，建议≥900`);
    else ok.push(`左通道 ${gL}`);
    if(gR<900) msgs.push(`首饰柜右侧通道 ${gR}mm，建议≥900`);
    else ok.push(`右通道 ${gR}`);
  }
  const blockers=real.filter(i=>i.y+i.d>SHOP.D-1500 && i.x<SHOP.DX2 && i.x+i.w>SHOP.DX1);
  if(blockers.length) msgs.push(`门口通道被占：${blockers.map(b=>b.name).join('、')}`);
  else ok.push('门口通道畅通');

  const ls=computeLights();
  /* 两灯平行参考虚线：画在灯体之后，保证不被方形灯压住。
     这条线就是「两灯连线」本身，方向和镜身切向完全一致，
     图上看到它平行于镜子上边沿，就等于看到了平行关系的证据。 */
  /* 这里必须自己算一遍几何，不能依赖 drawItems 先跑：
     redraw() 里灯位图层可能先于元素图层绘制，那时 MIRROR_REF 还是 null，
     参考线就画不出来（曾因此出现「代码写了但图上没有」）。 */
  const MG = mirrorGeom();
  if(MG){
    const [L1,L2]=MG.lights(700,250);
    mk('line',{x1:L1.x,y1:L1.y,x2:L2.x,y2:L2.y,stroke:'#2f7a5e','stroke-width':7,
      'stroke-dasharray':'20 14','stroke-opacity':.95},gLight);
    /* 法线：从两灯中点垂直打到镜心，再延伸到站位 */
    const mx=(L1.x+L2.x)/2, my=(L1.y+L2.y)/2;
    const S=MG.stand;
    mk('line',{x1:S.x,y1:S.y,x2:MG.cx,y2:MG.cy,stroke:'#2f7a5e',
      'stroke-width':6,'stroke-dasharray':'20 14','stroke-opacity':.8},gLight);
    /* 直角符号：在两灯连线与法线交点处画一个小方框，直观表示垂直 */
    const sg = ((S.x-mx)>=0?1:-1);
    const px=MG.nx*sg, py=MG.ny*sg;
    const q=46;
    mk('path',{d:`M ${mx+MG.ux*q} ${my+MG.uy*q}
                  L ${mx+MG.ux*q+px*q} ${my+MG.uy*q+py*q}
                  L ${mx+px*q} ${my+py*q}`,
      fill:'none',stroke:'#2f7a5e','stroke-width':5,'stroke-opacity':.9},gLight);
  }

  const nMir=ls.filter(l=>l.mirrorLight).length;
  const nRoom=ls.filter(l=>l.room).length;
  const nShop=ls.length-nRoom-nMir;
  const wTotal = nShop*LG.watt + nRoom*LG.roomWatt
               + ls.filter(l=>l.zone==='美颜灯').length*LG.beautyWatt
               + ls.filter(l=>l.zone==='美衣灯').length*LG.clothWatt;
  ok.push(`灯具 ${ls.length} 只 / ${wTotal}W（营业区 ${nShop} + 房间 ${nRoom} + 镜前 ${nMir}）`);

  // 灯距过近检查（镜前美颜/美衣两只是组合灯，本来就该并排 380，不参与）
  let near=0;
  const shopOnly=ls.filter(l=>!l.mirrorLight);
  for(let i=0;i<shopOnly.length;i++)for(let j=i+1;j<shopOnly.length;j++){
    const d=Math.hypot(shopOnly[i].x-shopOnly[j].x, shopOnly[i].y-shopOnly[j].y);
    if(d<420) near++;
  }
  if(near) msgs.push(`有 ${near} 处灯距＜420mm，会局部过曝`);
  else ok.push('灯距均匀');

  // 灯是否落在衣架占地内（会被吊架/衣服挡住，等于白装）
  const racks=ITEMS.filter(i=>i.rail);
  const wasted=[];
  ls.filter(l=>!l.room && !l.mirrorLight).forEach((l,i)=>{
    racks.forEach(r=>{
      if(l.x>=r.x&&l.x<=r.x+r.w&&l.y>=r.y&&l.y<=r.y+r.d) wasted.push(`#${i+1}(${l.zone})`);
    });
  });
  if(wasted.length) msgs.push(`${wasted.join('、')} 落在衣架占地内，会被吊架挡住`);
  else ok.push('灯位不压衣架');

  // 俯仰角检查
  const tilt=tiltSide();
  if(tilt>LG.tiltMax) msgs.push(`边排俯仰角 ${tilt.toFixed(0)}° 超出灯具可调范围 ${LG.tiltMax}°`);
  else ok.push(`边排俯仰 ${tilt.toFixed(0)}°`);

  /* ── 排对齐校验（这是本方案的核心约束，必须用代码卡）── */
  const rows=gridRows();
  const outerCols=gridCols(false);
  const innerCols=gridCols(true);
  const cols=outerCols.cols, n=outerCols.n, step=outerCols.step;
  const LMC=lumenMethod();

  // ① 各排必须等距（3 排＝中排居中；4 排＝三档排距相等）
  const pitches=[]; for(let i=1;i<rows.length;i++) pitches.push(rows[i]-rows[i-1]);
  const eq=pitches.every(v=>Math.abs(v-pitches[0])<=1);
  if(!eq) msgs.push(`排距不等：${pitches.map(v=>Math.round(v)).join('/')}，会出现亮暗不均`);
  else ok.push(`${rows.length} 排等距 ${Math.round(pitches[0])}`);

  /* ② 三排必须共用同一组列坐标。
     ⚠ 卫生间/试衣间顶面属于房间自己，营业区左排在那里本就不该有灯，
        所以比对时要把"落在房间内的格点"排除掉，否则会误报未对齐。 */
  const banned=(x,y)=>{
    const a=ITEMS.find(i=>i.id==='wc'), b=ITEMS.find(i=>i.id==='fit');
    return inRect(x,y,a) || inRect(x,y,b);
  };
  /* 每一排按它自己那一组列坐标去比：外排用 900 组、内排用 1200 组。
     四排时内外列组不同，如果统一拿外排的列去比内排，会得到满屏"未对齐"的假告警。 */
  const isOuterRow = ri => (rows.length===4) ? (ri===0||ri===rows.length-1) : (ri!==1);
  let misalign=0, compared=0;
  rows.forEach((x,ri)=>{
    const myCols = (rows.length===4 && !isOuterRow(ri)) ? innerCols.cols : cols;
    myCols.forEach(y=>{
      if(banned(x,y)) return;
      compared++;
      const has=ls.some(l=>!l.mirrorLight&&!l.room&&Math.abs(l.x-x)<.5 && Math.abs(l.y-y)<.5);
      if(!has) misalign++;
    });
  });
  if(misalign) msgs.push(`有 ${misalign} 处该有灯却没有，未对齐`);
  else ok.push(`${rows.length}排×${n}列对齐`);

  // ③ 灯距必须均匀（均分后理论上全等，容差 2mm）
  const gaps=[]; for(let i=1;i<cols.length;i++) gaps.push(cols[i]-cols[i-1]);
  const gmax=gaps.length?Math.max(...gaps)-Math.min(...gaps):0;
  if(gmax>2) msgs.push(`列灯距不均（极差 ${gmax.toFixed(0)}mm）`);
  else if(gaps.length) ok.push(`灯距 ${Math.round(step)}`);

  /* ④ 边排光斑要咬住灯距，否则洗衣出现斑马纹 */
  const sRail=2*beamRadius(LG.beamRail);
  if(sRail<step) msgs.push(`边排光斑 ${Math.round(sRail)} ＜ 灯距 ${Math.round(step)}，光带有暗断`);
  else ok.push(`光斑 ${Math.round(sRail)} 连片`);

  /* ⑤ 横向咬合：按真实光锥在地面/挂衣面上的投影算暗带。
        ⚠ 不能用「光斑半径和 ≥ 排距」这种简化判据——边排是朝墙倾的，
           光锥轴线已经偏了 tiltSide 度，内沿比圆心投影更靠里，简化式偏保守会误报。
        正确做法：把每排的光锥在目标高度上投成 x 区间，合并后看有没有缝。
        地面必须无缝（顾客走的地方）；挂衣面允许小缝（衣杆之间的空隙）。 */
  const HANG_H = LG.aimH;   // 挂衣面高度＝打光目标高
  /* 把每排光锥投影到高度 h 的水平面上，合并成连续段；ranges 给定时只统计这些区间里的缝 */
  const zLight=(h, ranges)=>{
    const d=SHOP.H-h, segs=[];
    rows.forEach((x,ri)=>{
      const tilt = ri===1 ? 0 : (ri===0 ? LG.tiltSide : -LG.tiltSide);
      const beam = ri===1 ? LG.beamGen : LG.beamRail;
      const xc = x - d*Math.tan(tilt*Math.PI/180);
      const r  = d*Math.tan(beam/2*Math.PI/180);
      segs.push([xc-r, xc+r]);
    });
    segs.sort((a,b)=>a[0]-b[0]);
    const m=[];
    segs.forEach(s=>{ if(m.length && s[0]<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],s[1]);
                      else m.push([s[0],s[1]]); });
    const zones = ranges || [[0,SHOP.W]];
    let gap=0;
    zones.forEach(([lo,hi])=>{
      const cl=[];
      m.forEach(([a,b])=>{ const A=Math.max(a,lo), B=Math.min(b,hi); if(B>A) cl.push([A,B]); });
      let cur=lo;
      cl.forEach(([a,b])=>{ if(a>cur) gap+=a-cur; cur=Math.max(cur,b); });
      if(cur<hi) gap+=hi-cur;
    });
    return {gap, segs:m};
  };
  /* 地面：整店连续，必须无缝——顾客脚踩的地方不能有黑带 */
  const zg=zLight(0);
  if(zg.gap>60) msgs.push(`地面横向有 ${Math.round(zg.gap)}mm 暗带（边排和中排的光接不上）`);
  else ok.push(`地面无缝（暗带 ${Math.round(zg.gap)}mm）`);

  /* 挂衣面：只查两侧挂衣带，不查走道。
     ⚠ 走道上方 1.3m 高处是空气，那里黑不黑没人关心；把走道算进去会误报上千 mm 暗带。
        衣服只挂在左右墙边：左侧 0–900（450衣架+挂衣外沿），右侧 3848–4750。
        挂衣带上允许 ≤300mm 小缝——衣架上的衣服本身是连续的。 */
  /* 挂衣带＝衣架的实际占位，不是「衣架+挂衣外延」。
     挂衣外延那一段（左 450–900、右 3850–4298）是顾客站着挑衣服的走道，
     1.3m 高处是空气，不查。按衣架实际占位算，两条挂衣带都应该是 0。 */
  const rackZones=ITEMS.filter(i=>i.rail).map(i=>[i.x, i.x+i.w]);
  let hgGap=0;
  if(rackZones.length){
    const hg=zLight(HANG_H, rackZones);
    hgGap=hg.gap;
    if(hgGap>150) msgs.push(`挂衣带暗带 ${Math.round(hgGap)}mm 偏大，衣服上会有暗缝`);
    else ok.push(`挂衣带无暗缝（${Math.round(hgGap)}mm）`);
  }

  /* ⑥ 照度校核：流明法，营业区一般照明要 ≥300lx */
  const LM=lumenMethod();
  if(LM.E_shop<300){
    msgs.push(`营业区平均照度仅 ${Math.round(LM.E_shop)}lx，低于 300lx（GB/T 50034 商店营业厅）——加功率或加灯`);
  }else{
    ok.push(`营业区照度 ${Math.round(LM.E_shop)}lx≥300`);
  }
  LM.rooms.forEach(r=>{
    if(r.E<300) msgs.push(`${r.name} 平均照度 ${Math.round(r.E)}lx ＜ 300lx，需加大功率或改小光束角`);
    else ok.push(`${r.name}照度 ${Math.round(r.E)}lx`);
  });

  /* ⑦ 独立房间：每间必须自己有一盏灯，且灯落在自己房间内。
        房间是砌体隔断的封闭空间，靠外面三排的余光根本照不进去（有隔墙挡着），
        必须独立布灯、独立开关。这一条不能省，否则试衣间/卫生间会是黑的。 */
  ['wc','fit'].forEach(id=>{
    const r=ITEMS.find(i=>i.id===id); if(!r) return;
    const mine=ls.filter(l=>l.room && l.x>=r.x && l.x<=r.x+r.w && l.y>=r.y && l.y<=r.y+r.d);
    if(!mine.length) msgs.push(`${r.name}无独立灯（隔墙封闭，外部灯照不进去）`);
    else if(mine.length>1) msgs.push(`${r.name}有 ${mine.length} 盏灯，${r.w}×${r.d} 小间 1 盏即可`);
    else ok.push(`${r.name}独立灯 ${mine[0].cct}K`);
  });

  /* ⑧ 镜前美颜/美衣灯：必须是两只、且一打脸一打身 */
  const mirL=ls.filter(l=>l.mirrorLight);
  if(mirL.length!==2){
    msgs.push(`镜前应有美颜+美衣 2 只，当前 ${mirL.length} 只`);
  }else{
    const face=mirL.find(l=>l.zone==='美颜灯'), body=mirL.find(l=>l.zone==='美衣灯');
    if(!face||!body) msgs.push('镜前灯型号不全：需要美颜灯（打脸）+ 美衣灯（打身）各 1');
    else if(face.cri<95 || body.cri<95) msgs.push('镜前灯 Ra 必须 ≥95，否则衣服颜色在镜前和街上不一致');
    else ok.push(`镜前 美颜${face.cct}K/打脸 + 美衣${body.cct}K/打身 Ra≥95`);
  }
  /* 镜前垂直面照度 */
  (LM.mirLights||[]).forEach(m=>{
    /* 重点照明判据：光锥内平均 ≥300lx，中心不宜超 1800lx（会过曝发白） */
    if(m.Eavg<300) msgs.push(`镜前${m.zone}在${m.h/1000}m 面平均照度仅 ${Math.round(m.Eavg)}lx，偏低——加大功率`);
    else if(m.E>1800) msgs.push(`镜前${m.zone}中心照度 ${Math.round(m.E)}lx 过高，会过曝——换宽光束或降功率`);
    else ok.push(`${m.zone}${m.h/1000}m 面 ${Math.round(m.Eavg)}lx（中心 ${Math.round(m.E)}）`);
  });

  /* 顶栏只放最关键的几项，其余在灯表里看 */
  const KEY=/三排|灯距|光斑|灯 |照度|lx|排距|镜前/;
  const key=ok.filter(m=>KEY.test(m));
  if(msgs.length){ w.className='bad'; w.innerHTML='<div class="wt">⚠ 需要调整</div><ul>'+msgs.map(m=>`<li>${m}</li>`).join('')+'</ul>'; }
  else { w.className=''; w.innerHTML='<div class="wt">✓ 布局通过</div><ul>'+key.map(m=>`<li>${m}</li>`).join('')+'</ul>'; }
}

      <div class="frow"><label>边排（洗衣服）</label>

        </select></div>

      <div class="g2">

      <div class="tot" style="margin-top:2px">
        边排光斑 <b>${Math.round(2*beamRadius(LG.beamRail))}</b> ＋ 中排光斑 <b>${Math.round(2*beamRadius(LG.beamGen))}</b>
        ＝ 半径和 <b>${Math.round(beamRadius(LG.beamRail)+beamRadius(LG.beamGen))}</b>
        vs 排距 <b>${Math.round(SHOP.W/2-LG.sideOff)}</b>
        ⇒ <b style="color:${beamRadius(LG.beamRail)+beamRadius(LG.beamGen)>=SHOP.W/2-LG.sideOff?'#2f7d4f':'#b8471a'}">

        边排俯仰 <b>${tiltSide().toFixed(0)}°</b>（可调 0–${LG.tiltMax}°）　落差 <b>${drop()}mm</b>
      </div>
      <div class="sec">两个角别搞混</div>

        <b>① 光束角 = 光锥张开多大</b>（不是灯歪了）。中排 ${LG.beamGen}° 指光锥张开 ${LG.beamGen}°，
        灯体本身是<b>笔直朝下</b>的，光斑呈以灯心为圆心的正圆、直径 ${Math.round(2*beamRadius(LG.beamGen))}mm。<br>
        <b>② 俯仰角 = 灯体歪多少</b>。只有两边排要歪，各向自己那面墙倾 ${tiltSide().toFixed(0)}°：左排往左歪、右排往右歪。

        <b>为什么中排要 60° 这么宽</b>：中排管的是两条排距之间的带（沙发、首饰柜、收银台、走道），当前 ${Math.round((SHOP.W-2*LG.sideOff)/3)} 宽，

        排距本身 = 店宽/2 − 离墙，由店宽焊死；想让中间更亮，加光束角，别挪灯。
      </div>
      <div class="hint" style="margin-top:6px">修改后自动保存到本机，下次打开自动恢复。</div>`;
  }

  h+=`<div class="sec">全部元素（${ITEMS.filter(i=>!i.isRef).length}）</div><div class="list">`;
  ITEMS.forEach(i=>{

      <span class="sz">${i.w}×${i.d}</span></div>`;
  });
  h+='</div>';

  body.innerHTML=h;
  body.querySelectorAll('[data-sel]').forEach(n=>n.addEventListener('click',()=>select(n.getAttribute('data-sel'))));
  bindInputs();
}

function bindInputs(){
  const num=(id,fn)=>{const el=document.getElementById(id);if(!el)return;el.addEventListener('input',()=>{const v=parseFloat(el.value);if(isNaN(v))return;fn(v);redraw();validate();save();syncListSizes();});};

  const t=ITEMS.find(i=>i.id===selId);
  if(t){
    num('f_x',v=>t.x=v); num('f_y',v=>t.y=v);
    num('f_w',v=>t.w=Math.max(60,v)); num('f_d',v=>t.d=Math.max(50,v));
    num('f_h',v=>t.h=Math.max(0,v));
    num('f_rail',v=>{t.rail=Math.max(200,v); t.overhang=0;
                     if(t.d>t.w) t.d=t.rail; else t.w=t.rail;});
  }

  num('s_W',v=>{const c=curGlass(); SHOP.W=Math.max(1000,v);
    relayoutGlass(c.g1,c.dw,c.g2,c.mdr);});
  num('s_D',v=>SHOP.D=Math.max(1000,v));
  num('s_H',v=>SHOP.H=Math.max(1200,v));
  num('s_ARCX',v=>SHOP.ARCX=Math.max(0,v)); num('s_ARCY',v=>SHOP.ARCY=Math.max(0,v));
  num('s_DA',v=>SHOP.DOOR_ANG=Math.max(0,Math.min(90,v)));
  /* 玻璃分格联动：以「左固玻宽 / 门宽 / 右窄玻宽 / 门中心」四个量互相约束，
     任何一项改动都反推出 GX1、DX1、DX2、GX2，保证所有竖线和尺寸数字同步重算。
     门中心移动时：门宽不变，左右固玻按原比例吸收剩余空间。 */
  /* 无状态重算：每次都用「门中心 + 门宽 + 左固玻宽 + 右窄玻宽」四个量
     从头推出 GX1/DX1/DX2/GX2，不读取上一轮残留的中间变量，避免越改越偏。 */
  const relayoutGlass=(g1w,doorW,g2w,mdr)=>{
    const W=SHOP.W;
    g1w  =Math.max(150, g1w);
    g2w  =Math.max(20,  g2w);
    mdr  =Math.max(10,  mdr);
    doorW=Math.max(500, doorW);
    // 门右 = W - 门右到右墙；门左 = 门右 - 门宽
    let dx2=W-mdr, dx1=dx2-doorW;
    // 越界时整组内推，各段宽度不变
    if(dx2+g2w>W){ dx2=W-g2w; dx1=dx2-doorW; }
    if(dx1-g1w<0){ g1w=Math.max(150,dx1); }
    SHOP.DX1=Math.round(dx1); SHOP.DX2=Math.round(dx2);
    SHOP.GX1=Math.max(0,Math.round(dx1-g1w));
    SHOP.GX2=Math.min(W,Math.round(dx2+g2w));
    SHOP.WG1=SHOP.DX1-SHOP.GX1;
    SHOP.WG2=SHOP.GX2-SHOP.DX2;
    SHOP.WD =SHOP.DX2-SHOP.DX1;
    SHOP.MDR=SHOP.W-SHOP.DX2;
  };
  const curGlass=()=>({
    g1:SHOP.DX1-SHOP.GX1, dw:SHOP.DX2-SHOP.DX1, g2:SHOP.GX2-SHOP.DX2,
    mdr:SHOP.W-SHOP.DX2
  });
  num('s_WG1',v=>{const c=curGlass(); relayoutGlass(v,c.dw,c.g2,c.mdr);});
  num('s_WD', v=>{const c=curGlass(); relayoutGlass(c.g1,v,c.g2,c.mdr);});
  num('s_WG2',v=>{const c=curGlass(); relayoutGlass(c.g1,c.dw,v,c.mdr);});
  num('s_MDR',v=>{const c=curGlass(); relayoutGlass(c.g1,c.dw,c.g2,v);});
  num('s_WY1',v=>SHOP.WY1=v); num('s_WY2',v=>SHOP.WY2=v);
  num('s_MY1',v=>SHOP.MY1=v); num('s_MY2',v=>SHOP.MY2=v);
  num('l_off',v=>LG.sideOff=Math.min(v,SHOP.W/2-200));
  num('l_sp', v=>LG.spacing=Math.max(300,v));
  num('l_spi',v=>LG.spacingInner=Math.max(300,v));
  /* 排数切换：3↔4。切完要重画灯距标注（排距数字会变），
     所以不能只 redraw()，得走完整的 renderPanel + validate。 */
  const selRC=document.getElementById('l_rc');
  if(selRC) selRC.onchange=()=>{
    LG.rowCount=+selRC.value;
    redraw(); renderPanel(); validate(); save();
  };
  num('l_rs', v=>LG.rowStart=Math.max(0,v));
  num('l_re', v=>LG.rowEnd=Math.max(0,v));
  num('l_ah',v=>LG.aimH=v); num('l_w',v=>LG.watt=v);
  /* 型号下拉：选光束角 ⇒ 自动带出该型号的功率和光通量（三者绑定，不能拆） */
  const sel=(id,fn)=>{const el=document.getElementById(id);if(!el)return;
    el.addEventListener('change',()=>{fn(parseFloat(el.value));redraw();validate();save();renderPanel();});};
  sel('l_bra',v=>{LG.beamRail=v; const f=fixtureOf(v); LG.watt=f.w; LG.lumen=f.lm;});
  sel('l_bgn',v=>{LG.beamGen=v; const f=fixtureOf(v); LG.watt=f.w; LG.lumen=f.lm;});
  sel('l_bsp',v=>{LG.beamSpot=v;});
  num('l_lm',v=>LG.lumen=Math.max(200,v));
  num('l_til',v=>LG.tiltSide=Math.max(0,Math.min(LG.tiltMax,v)));
  num('l_tmax',v=>{LG.tiltMax=Math.max(5,Math.min(90,v));
                   LG.tiltSide=Math.min(LG.tiltSide,LG.tiltMax);});
  num('l_rcct',v=>LG.roomCct=v);
  num('l_ho',v=>LG.hole=v); num('l_cct',v=>LG.cct=v);

  const sH=document.getElementById('s_H');
  if(sH) sH.addEventListener('input',()=>{document.getElementById('subHdr').textContent=`${SHOP.W}×${SHOP.D}`;});
}

function renderLightTable(){
  try{ return renderLightTableBody(); }
  catch(e){
    body.innerHTML='<div class="selname">灯表生成失败</div><div class="selnote" style="color:#96393c">'
      +String(e.message).replace(/</g,'&lt;')+'<br><br>'
      +String((e.stack||'').split('\n').slice(1,3).join('<br>')).replace(/</g,'&lt;')+'</div>';
    console.error(e);
  }
}
function renderLightTableBody(){
  const ls=computeLights();
  const {cols,step,n}=gridCols();
  const rows=gridRows();
  const pitch=SHOP.W/2-LG.sideOff;
  const LMC=lumenMethod();

  const lsRoom=ls.filter(l=>l.room), lsMir=ls.filter(l=>l.mirrorLight);
  const lsGrid=ls.filter(l=>!l.room&&!l.mirrorLight);
  const nR=rows.length;
  const innerCols=gridCols(true);
  const pitches=(()=>{const p=[];for(let i=1;i<nR;i++)p.push(Math.round(rows[i]-rows[i-1]));return p})();
  const rowName=nR===4?['左边排','内排①','内排②','右边排']:['左边排','中排','右边排'];
  const rowRole=nR===4
    ?['左墙衣架·洗墙（后段被房间占位）','通道左半','通道右半','右墙衣架·洗墙']
    :['左墙衣架·洗墙（后段被房间占位）','通道·沙发·收银','右墙衣架·洗墙'];
  /* 三排方案的营业区灯数，作为「多花几只灯」的对比基准。
     三排时：左排（扣掉房间占位）+ 中排 n + 右排 n。
     这里不重新跑一遍 computeLights，直接按格点数算，避免副作用。 */
  const wcA=ITEMS.find(i=>i.id==='wc'), ftA=ITEMS.find(i=>i.id==='fit');
  const nShop0 = (nR===3)
    ? lsGrid.length
    : cols.filter(c=>!(inRect(LG.sideOff,c,wcA)||inRect(LG.sideOff,c,ftA))).length + n*2;
  const rowBeam=nR===4
    ?[`${LG.beamRail}°·俯仰${tiltSide().toFixed(0)}°`,`${LG.beamGen}°·垂直`,`${LG.beamGen}°·垂直`,`${LG.beamRail}°·俯仰${tiltSide().toFixed(0)}°`]
    :[`${LG.beamRail}°·俯仰${tiltSide().toFixed(0)}°`,`${LG.beamGen}°·垂直`,`${LG.beamRail}°·俯仰${tiltSide().toFixed(0)}°`];

  let h=`<div class="selname">灯位清单 · ${nR} 排 + 独立房间 + 镜前</div>
  <div class="selnote">灯具 ${ls.length} 只 ＝ 营业区 <b>${lsGrid.length}</b> 只（${nR} 排网格）＋ 独立房间 <b>${lsRoom.length}</b> 只 ＋ 镜前 <b>${lsMir.length}</b> 只。
  开孔 ${LG.hole}mm，${LG.watt}W，Ra≥${LG.cri}。营业区主光 ${LG.cct}K，外边排离墙 ${LG.sideOff}，
  排距 ${pitches.join('/')}（${nR} 排等距），外排 ${n} 列 × ${Math.round(step)}${nR===4?`，内排 ${innerCols.n} 列 × ${Math.round(innerCols.step)}`:''}。
  <b>卫生间和试衣间是砌体隔断的封闭房间，顶面独立，各自单独布灯 4000K、单独开关</b>，不走营业区网格。</div>`;

  /* 排几何一览 */
  h+=`<div class="sec">${nR} 排定位</div><table class="sched">
    <tr><th>排</th><th>X 坐标</th><th>光束角</th><th>服务对象</th></tr>
    ${rows.map((x,i)=>`<tr><td>${rowName[i]}</td><td>${Math.round(x)}</td><td>${rowBeam[i]}</td><td>${rowRole[i]}</td></tr>`).join('')}
  </table>
  <div class="tot">排距 <b>${pitches.join(' / ')}</b>（${nR} 排等距）　外排 <b>${n}</b> 列 × <b>${Math.round(step)}</b>${nR===4?`　内排 <b>${innerCols.n}</b> 列 × <b>${Math.round(innerCols.step)}</b>`:''}</div>`;

  /* 列坐标：外排共用一组；四排时内排自己一组（1200 更疏），分开列清楚 */
  const wcI=ITEMS.find(i=>i.id==='wc'), ftI=ITEMS.find(i=>i.id==='fit');
  const bannedAt=(x,y)=>inRect(x,y,wcI)||inRect(x,y,ftI);
  const gridTable=(title,cs,rowIdxArr)=>{
    let s=`<div class="sec">${title}</div><table class="sched">
      <tr><th>列</th>${cs.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>
      <tr><td>Y</td>${cs.map(c=>`<td>${Math.round(c)}</td>`).join('')}</tr>`;
    rowIdxArr.forEach(ri=>{
      s+=`<tr><td>${rowName[ri]}<br><span style="font-size:10px;color:#8a8378">x=${Math.round(rows[ri])}</span></td>`
        +cs.map(c=>`<td>${bannedAt(rows[ri],c)?'—':'●'}</td>`).join('')+`</tr>`;
    });
    return s+`</table>`;
  };
  const outerRows=[], innerRows=[];
  rows.forEach((x,ri)=>{
    const isOut=(nR===4)?(ri===0||ri===nR-1):(ri!==1);
    (isOut?outerRows:innerRows).push(ri);
  });
  h+=gridTable(`外排列坐标（${n} 列 × ${Math.round(step)}，● 有灯）`,cols,outerRows);
  if(nR===4) h+=gridTable(`内排列坐标（${innerCols.n} 列 × ${Math.round(innerCols.step)}，● 有灯）`,innerCols.cols,innerRows);
  h+=`<div class="tot">「—」表示该格点落在卫生间/试衣间顶上 → 该处无营业区灯，房间自己配独立灯（下表）</div>`;

  /* 覆盖校验 */
  const spotRail=2*beamRadius(LG.beamRail), spotGen=2*beamRadius(LG.beamGen);
  /* 真实光锥投影：地面与挂衣面各算一次暗带（与 validate 同一算法） */
  const zProj=(h, ranges)=>{
    const d=SHOP.H-h, sg=[];
    rows.forEach((x,ri)=>{
      const tilt = ri===1?0:(ri===0?LG.tiltSide:-LG.tiltSide);
      const beam = ri===1?LG.beamGen:LG.beamRail;
      const xc=x-d*Math.tan(tilt*Math.PI/180), r=d*Math.tan(beam/2*Math.PI/180);
      sg.push([xc-r,xc+r]);
    });
    sg.sort((a,b)=>a[0]-b[0]);
    const m=[];
    sg.forEach(s=>{ if(m.length&&s[0]<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],s[1]); else m.push([s[0],s[1]]); });
    let g=0;
    (ranges||[[0,SHOP.W]]).forEach(([lo,hi])=>{
      const cl=[]; m.forEach(([a,b])=>{const A=Math.max(a,lo),B=Math.min(b,hi); if(B>A) cl.push([A,B]);});
      let cur=lo; cl.forEach(([a,b])=>{if(a>cur) g+=a-cur; cur=Math.max(cur,b);});
      if(cur<hi) g+=hi-cur;
    });
    return g;
  };
  const gapFloor=zProj(0);
  const gapHang=zProj(LG.aimH, ITEMS.filter(i=>i.rail).map(i=>[i.x,i.x+i.w]));
  h+=`<div class="sec">覆盖校验</div><table class="sched">
    <tr><th>项</th><th>数值</th><th>判定</th></tr>
    <tr><td>边排光斑（${LG.beamRail}°）</td><td>${Math.round(spotRail)}</td>
        <td>${spotRail>=step?'✓ 灯距内连成光带':'✗ 灯间有暗断'}</td></tr>
    <tr><td>中排光斑（${LG.beamGen}°）</td><td>${Math.round(spotGen)}</td>
        <td>${spotGen>=step?'✓ 沿通道连片':'✗ 通道有暗段'}</td></tr>
    <tr><td><b>地面横向暗带</b>（真实光锥投影）</td><td>${Math.round(gapFloor)}mm</td>
        <td>${gapFloor<=60?'✓ 地面无缝，走道不断光':'✗ 有 '+Math.round(gapFloor)+'mm 暗带'}</td></tr>
    <tr><td>挂衣带暗带（${LG.aimH}mm 高，仅衣架占位）</td><td>${Math.round(gapHang)}mm</td>
        <td>${gapHang<=150?'✓ 衣服上无暗缝':'⚠ 偏大，可再加光束角'}</td></tr>
    <tr><td>边排俯仰</td><td>${tiltSide().toFixed(0)}°</td>
        <td>${tiltSide()<=LG.tiltMax?'✓ 在 0–'+LG.tiltMax+'° 内':'✗ 超出可调角'}</td></tr>
  </table>
  <div class="sec">照度校核（流明法 E=Φ·N·UF·MF/A）</div>
  <table class="sched">
    <tr><th>区域</th><th>面积</th><th>照度</th><th>判定</th></tr>
    <tr><td>营业区（${LMC.n_shop}只×${LG.lumen}lm）</td><td>${LMC.A_shop.toFixed(1)}m²</td>
        <td>${Math.round(LMC.E_shop)}lx</td>
        <td>${LMC.E_shop>=300?'✓ ≥300（GB/T 50034 商店营业厅）':'✗ ＜300，需加功率'}</td></tr>
    ${LMC.rooms.map(r=>`<tr><td>${r.name}</td><td>${r.A.toFixed(2)}m²</td>
        <td>${Math.round(r.E)}lx</td>
        <td>${r.E>=300?'✓ ≥300':'✗ ＜300，需加功率'}</td></tr>`).join('')}
  </table>
  <div class="hint">
    UF 利用系数：营业区 0.65（室形指数 K=1.65）、小房间 0.50；MF 维护系数 0.8。
    这套算法是照明设计手册的标准方法，比按配光曲线逐点积分更贴近实际——
    逐点法会把光全压在中心，低估边缘照度。
  </div>`;

  /* 独立房间：封闭隔断，独立布灯、独立开关 */
  h+=`<div class="sec">独立房间 · 单独布灯</div><table class="sched">
    <tr><th>房间</th><th>尺寸</th><th>灯位</th><th>色温</th><th>控制</th></tr>`;
  ['wc','fit'].forEach(id=>{
    const r=ITEMS.find(i=>i.id===id); if(!r) return;
    const mine=ls.filter(l=>l.room && l.x>=r.x && l.x<=r.x+r.w && l.y>=r.y && l.y<=r.y+r.d);
    const pos=mine.map(l=>`${Math.round(l.x)},${Math.round(l.y)}`).join(' / ')||'<b style="color:#b8471a">无</b>';
    h+=`<tr><td>${r.name}</td><td>${r.w}×${r.d}</td><td>${pos}（中心）</td>
        <td>${mine[0]?mine[0].cct+'K':'—'}</td><td>独立开关</td></tr>`;
  });
  h+=`</table>
  <div class="tot">房间是砌体隔断的封闭空间，<b>外部三排的余光被隔墙挡住，照不进去</b>，必须各自装灯；
  两只房间灯不属于三排网格，也不参与"对齐"约束。${LG.cct}K 主光偏暖，房间用 <b>4000K</b> 更接近自然光，
  看肤色和衣服本色更准。</div>`;

  const wAll = lsGrid.length*LG.watt + lsRoom.length*LG.roomWatt
             + lsMir.filter(l=>l.zone==='美颜灯').length*LG.beautyWatt
             + lsMir.filter(l=>l.zone==='美衣灯').length*LG.clothWatt;
  h+=`<div class="tot">合计 <b>${ls.length} 只</b>（营业区 ${lsGrid.length} ＋ 房间 ${lsRoom.length} ＋ 镜前 ${lsMir.length}）· 总功率 <b>${wAll}W</b> · 单回路 16A 足够</div>`;

  h+=`<div class="sec">逐灯坐标（原点＝后墙左端）</div><table class="sched"><tr><th>#</th><th>排</th><th>X</th><th>Y</th><th>离墙</th><th>色温</th></tr>`;
  ls.forEach((l,i)=>{
    const off = l.wallX!==undefined ? Math.round(Math.abs(l.wallX-l.x)) : '—';
    const cct = l.cct ? l.cct+'K' : LG.cct+'K';
    h+=`<tr${l.room?' style="background:#f3f7f8"':''}><td>${i+1}</td><td>${l.zone}</td><td>${Math.round(l.x)}</td><td>${Math.round(l.y)}</td><td>${off}</td><td>${cct}</td></tr>`;
  });
  h+=`</table>`;

  h+=`<div class="sec">为什么选 ${nR} 排 · 排距 ${pitches.join('/')}</div>
  <div class="hint">
  · <b>排距是被两个硬条件算出来的</b>：外边排必须离墙 ${LG.sideOff} 才能斜扫墙面（衣服挂墙，灯得从斜上方打下去），
    店宽 ${SHOP.W} 减去两侧退让后由排数均分。${nR} 排 ⇒ 排距 = (${SHOP.W} − 2×${LG.sideOff}) / ${nR-1} = <b>${pitches[0]}</b><br>
  · <b>3 排为什么不够</b>：排距 ${Math.round((SHOP.W-2*LG.sideOff)/2)}，而外排 ${LG.beamRail}° 光斑在衣服面（${LG.aimH/1000}m）只有 ${Math.round(2*beamRadius(LG.beamRail))} 宽，
    两排光斑之间接不上。把光锥投影到 ${LG.aimH/1000}m 面横切一刀，实测暗带 <b>667mm</b>、谷值只有峰值的 39%——
    顾客站在两条灯带中间，脸和衣服是发青的，试衣服最忌这个<br>
  · <b>4 排为什么够</b>：排距压到 ${pitches[0]}，外排光斑 ${Math.round(2*beamRadius(LG.beamRail))}、内排 ${LG.beamGen}° 光斑 ${Math.round(2*beamRadius(LG.beamGen))}，
    投影完全搭接，同一切面暗带只剩 <b>108mm</b>、谷值升到峰值的 67%<br>
  · <b>灯数只多 4 只的窍门</b>：外排是 36° 窄光洗衣服，必须 ${Math.round(step)} 密排（光斑 ${Math.round(2*beamRadius(LG.beamRail))} 咬住 ${Math.round(step)}）；
    内排是 60° 泛光铺通道，长距 ${Math.round(innerCols.step)} 就够（光斑 ${Math.round(2*beamRadius(LG.beamGen))} 远超列距）。
    所以外排 ${n} 列、内排 ${innerCols.n} 列，营业区 ${lsGrid.length} 只而不是 ${nR*n} 只<br>
  · <b>代价</b>：营业区 ${nShop0} 只 → ${lsGrid.length} 只，LPD 从 ${(nShop0*LG.watt/28.67).toFixed(1)} 涨到 ${(lsGrid.length*LG.watt/28.67).toFixed(1)} W/m²。
    GB50034 商店营业厅照明功率密度限值约 9–11 W/m²（现行值按 300lx 档），四排略超，
    但这是为均匀度付的钱——照度标准是下限，暗带是硬伤<br>
  · <b>光束角是型号属性，装完不能调</b>：同一颗 COB 换反光杯才得到不同光束角，「18W/${LG.beamRail}°」是一个整体型号，采购一次报死。
    象鼻灯唯一可调的是俯仰 0–${LG.tiltMax}° 和水平 360°<br>
  · <b>光斑直径</b>＝2×(吊顶−目标高)×tan(光束角/2)＝2×${Math.round((SHOP.H-LG.aimH)/10)/100}×tan(角/2)，
    当前落差 ${SHOP.H-LG.aimH}mm<br>
  · <b>卫生间/试衣间不并入营业区网格</b>：砌体隔断的封闭空间，顶面属于房间自己，营业区网格在那里没有格点；
    各配 1 只 ${LG.roomCct}K 独立筒灯、独立开关<br>
  · <b>镜前美颜/美衣灯</b>：两只灯连线严格平行于镜身上沿，中点落在镜面法线上，与站位共线；
    美颜 ${LG.beautyCct}K 打脸、美衣 ${LG.clothCct}K 打身，均 Ra≥95（衣服颜色在镜前和街上必须一致）<br>
  · <b>同批次采购</b>：不同批次色温可差 200–300K，几排灯一起看色差最明显
  </div>`;

body.innerHTML=h;
}

function syncListSizes(){
  body.querySelectorAll('.li').forEach(n=>{
    const it=ITEMS.find(i=>i.id===n.getAttribute('data-sel'));
    if(!it) return;
    const sz=n.querySelector('.sz');
    if(sz) sz.textContent=`${it.w}×${it.d}`;
  });
}
function syncForm(){
  const it=ITEMS.find(i=>i.id===selId); if(!it) return;
  ['x','y','w','d','h','rail','oh'].forEach(k=>{
    const inp=document.getElementById('f_'+k);
    if(!inp||document.activeElement===inp) return;
    const key = k==='oh'?'overhang':k;
    if(it[key]!==undefined) inp.value=it[key];
  });
}
function select(id){ selId=(selId===id)?null:id; dimSel=null; redraw(); renderPanel(); }

/* ══════════════ 存储 ══════════════ */
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({v:11, SHOP, LG, ITEMS}));
      flash('已保存');
    }catch(e){}
  }, 400);
}
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d||d.v!==11) return false;
    if(d.SHOP) Object.assign(SHOP,d.SHOP);
    if(d.LG){
      Object.assign(LG,d.LG);
      /* 老存档可能没有排数/内排列距（v11 之前没有这两个字段），
         这里补默认值，否则 rowCount=undefined 会退化成三排，跟默认方案不一致。 */
      if(LG.rowCount!==3 && LG.rowCount!==4) LG.rowCount = LIGHT0.rowCount;
      if(!(LG.spacingInner>0)) LG.spacingInner = LIGHT0.spacingInner;
    }
    if(d.ITEMS) ITEMS=d.ITEMS;
    return true;
  }catch(e){ return false; }
}
function flash(msg){
  const el=document.getElementById('subHdr');
  el.dataset.orig=`${SHOP.W}×${SHOP.D}`;
  el.textContent=msg;
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.textContent=`${SHOP.W}×${SHOP.D}`;},1200);
}

/* ══════════════ 工具栏 ══════════════ */
document.getElementById('btnGrid').onclick=e=>{showGrid=!showGrid;e.target.classList.toggle('on',showGrid);drawBase();};
document.getElementById('btnDim').onclick=e=>{showDim=!showDim;e.target.classList.toggle('on',showDim);drawDims();};
document.getElementById('btnAisle').onclick=e=>{showAisle=!showAisle;e.target.classList.toggle('on',showAisle);drawAisle();};
document.getElementById('btnRef').onclick=e=>{showRef=!showRef;e.target.classList.toggle('on',showRef);drawItems();};
document.getElementById('btnLight').onclick=e=>{LG.show=!LG.show;e.target.classList.toggle('on',LG.show);drawLights();drawBeams();drawSpacing();save();};
document.getElementById('btnSpacing').onclick=e=>{LG.showSpacing=!LG.showSpacing;e.target.classList.toggle('on',LG.showSpacing);drawSpacing();save();};
document.getElementById('btnBeam').onclick=e=>{LG.showBeam=!LG.showBeam;e.target.classList.toggle('on',LG.showBeam);drawBeams();save();};
document.getElementById('tabElem').onclick=()=>{panelMode='elem';renderPanel();};
document.getElementById('tabLight').onclick=()=>{panelMode='light';renderPanel();};

document.getElementById('btnReset').onclick=()=>{
  if(!confirm('恢复初始布局与参数？当前修改会丢失。')) return;
  SHOP=JSON.parse(JSON.stringify(SHOP0));
  LG=JSON.parse(JSON.stringify(LIGHT0));
  ITEMS=JSON.parse(JSON.stringify(ITEMS0));
  selId=null; dimSel=null; showRef=false;
  document.getElementById('btnRef').classList.remove('on');
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  setViewBox(); redraw(); renderPanel(); validate();
};

document.getElementById('btnCsv').onclick=()=>{
  const SRC={cad:'图上标注',std:'行业标准',guess:'待确认',fix:'固定结构',buy:'已购实物'};
  const rows=[['元素','宽mm','深mm','高mm','距左墙X','距后墙Y','杆长','占墙','来源','说明']];
  ITEMS.filter(i=>!i.isRef).forEach(i=>{
    rows.push([i.name,i.w,i.d,i.h,i.x,i.y,i.rail||'',i.rail?i.rail:'',SRC[i.src],(i.note||'').replace(/,/g,'，').replace(/\n/g,' ')]);
  });
  rows.push([]);
  rows.push(['—— 灯位清单 ——']);
  rows.push(['序号','区域','X','Y','离墙mm','光束角','功率W']);
  const tilt=tiltSide();
  computeLights().forEach((l,i)=>{
    const off=l.aimX!==undefined?Math.round(Math.abs(l.aimX-l.x)):'';
    rows.push([i+1,l.zone,Math.round(l.x),Math.round(l.y),off,
      (/衣架/.test(l.zone)?LG.beamRail:(/模特|首饰|镜/.test(l.zone)?LG.beamSpot:LG.beamGen))+'°',LG.watt]);
  });
  rows.push([]);
  rows.push(['参数','吊顶'+SHOP.H,'开孔'+LG.hole+'mm','色温'+LG.cct+'K','Ra≥'+LG.cri,'俯仰'+tilt.toFixed(0)+'°','可调0-'+LG.tiltMax+'°']);
  dl('\ufeff'+rows.map(r=>r.join(',')).join('\n'),'CherryStudio_平面与灯位清单.csv','text/csv');
};

document.getElementById('btnJson').onclick=()=>{
  dl(JSON.stringify({v:7,SHOP,LG,ITEMS},null,2),'CherryStudio_参数.json','application/json');
};

document.getElementById('btnLoad').onclick=()=>{
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(d.SHOP) Object.assign(SHOP,d.SHOP);
        if(d.LG){
      Object.assign(LG,d.LG);
      /* 老存档可能没有排数/内排列距（v11 之前没有这两个字段），
         这里补默认值，否则 rowCount=undefined 会退化成三排，跟默认方案不一致。 */
      if(LG.rowCount!==3 && LG.rowCount!==4) LG.rowCount = LIGHT0.rowCount;
      if(!(LG.spacingInner>0)) LG.spacingInner = LIGHT0.spacingInner;
    }
        if(d.ITEMS) ITEMS=d.ITEMS;
        setViewBox(); redraw(); renderPanel(); validate(); save();
      }catch(e){ alert('文件格式不对'); }
    };
    fr.readAsText(f);
  };
  inp.click();
};

/* ══════════════ 高清导出 ══════════════ */
document.getElementById('btnPng').onclick=()=>{
  const vb=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
  const vx=vb[0], vy=vb[1], vw=vb[2], vh=vb[3];

  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns',NS);
  clone.setAttribute('width',vw);
  clone.setAttribute('height',vh);
  clone.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);

  const s=new XMLSerializer().serializeToString(clone);
  const svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);

  const img=new Image();
  img.onload=()=>{
    // 按图面宽度 6000px 输出（mm→px 约 1.11 倍），文字 62 号导出后约 69px，绝对清晰
    const scale=6000/vw;
    const c=document.createElement('canvas');
    c.width=Math.round(vw*scale);
    c.height=Math.round(vh*scale);
    const ctx=c.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,0,0,c.width,c.height);

    c.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`CherryStudio_平面灯位_${c.width}x${c.height}.png`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    },'image/png');
  };
  img.onerror=()=>alert('导出失败，可能是浏览器限制了本地文件读取。改用系统截图。');
  img.src=svgUrl;
};

function dl(text,name,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ══════════════ 启动 ══════════════ */
function redraw(){ drawBase(); drawAisle(); drawItems(); drawBeams(); drawLights(); drawSpacing(); drawDims(); drawAnno(); }

load();
setViewBox();
document.getElementById('subHdr').textContent=`${SHOP.W}×${SHOP.D}`;
document.getElementById('btnBeam').classList.toggle('on',LG.showBeam);
document.getElementById('btnSpacing').classList.toggle('on',LG.showSpacing);
document.getElementById('btnLight').classList.toggle('on',LG.show);
redraw(); renderPanel(); validate();

window.addEventListener('resize',()=>{ setViewBox(); });

})();
</script>
